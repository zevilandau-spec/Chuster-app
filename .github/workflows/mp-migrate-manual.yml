name: Box printer - move hand-added boxes into the app's record
on: workflow_dispatch
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Move day.manual entries into mp/'manual'
        env:
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
          CHUSTER_DB_URL: ${{ secrets.CHUSTER_DB_URL }}
        run: |
          pip install -q cryptography
          python3 - <<'PY'
          import json, os, base64, time, urllib.request
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          S = json.loads(os.environ['CHUSTER_SECRETS'])['sync']
          url = os.environ['CHUSTER_DB_URL'].strip().rstrip('/'); sp = S['space']; g = AESGCM(base64.b64decode(S['key']))
          def dec(v): raw = base64.b64decode(v); return json.loads(g.decrypt(raw[:12], raw[12:], None))
          def enc(o): iv = os.urandom(12); return base64.b64encode(iv + g.encrypt(iv, json.dumps(o).encode(), None)).decode()
          def get(p): return json.load(urllib.request.urlopen(f"{url}/{sp}/{p}.json", timeout=60))
          def put(p, o): urllib.request.urlopen(urllib.request.Request(f"{url}/{sp}/{p}.json", data=json.dumps({'v': enc(o), 't': {'.sv': 'timestamp'}}).encode(), method='PUT'), timeout=60).read()
          def b36(n):
              d = '0123456789abcdefghijklmnopqrstuvwxyz'; s = ''
              while True:
                  n, r = divmod(n, 36); s = d[r] + s
                  if n == 0: return s
          def h(s):  # same as the app's SYNC id hash
              a, b = 0x811c9dc5, 0x9e3779b9
              for ch in s:
                  c = ord(ch); a = ((a ^ c) * 16777619) & 0xffffffff; b = ((b ^ c) * 2246822519) & 0xffffffff
              return b36(a) + b36(b)
          mp = get('mp') or {}
          ids = {}
          for kid, r in mp.items():
              try: ids[dec(r['v']).get('k')] = kid
              except Exception: pass
          assert ids.get('map') == h('mp|map'), ('hash check failed', ids.get('map'), h('mp|map'))
          print("::notice::id hash matches the app (map=%s)" % ids['map'])
          mid = h('mp|manual')
          man = (dec(mp[mid]['v']).get('val') or {}) if mid in mp else {}
          moved = []
          for kid in [k for k in mp if k.isdigit() and len(k) == 8]:
              o = dec(mp[kid]['v']); val = o.get('val', {}); dm = val.get('manual')
              if not dm: continue
              day = val['d']
              for lab, m in dm.items():
                  man.setdefault(day, {})[lab] = {'n': int(m['n']), 's': m.get('s', ''), 'e': m.get('e', ''), 'by': 'Zevi', 'at': time.strftime('%Y-%m-%dT%H:%M:%S')}
                  moved.append((day, lab, m['n']))
          if not moved: print("::notice::nothing to move"); raise SystemExit(0)
          # 1) take them out of the server's copy of each day (it stops carrying them once 'manual' is gone)
          for attempt in range(6):
              left = 0
              for day, lab, n in moved:
                  kid = day.replace('-', ''); o = dec(get('mp/' + kid)['v']); val = o['val']
                  if not val.get('manual') and lab not in (val.get('labels') or {}): continue
                  val.pop('manual', None)
                  val.get('labels', {}).pop(lab, None); val.get('times', {}).pop(lab, None)
                  if isinstance(val.get('order'), list): val['order'] = [x for x in val['order'] if x != lab]
                  o['val'] = val; put('mp/' + kid, o); left += 1
              # 2) and into the app's own record (written right after, so the app never counts it twice)
              put('mp/' + mid, {'k': 'manual', 'val': man, 'by': 'Zevi'})
              urllib.request.urlopen(urllib.request.Request(f"{url}/{sp}/_t.json", data=b'{".sv":"timestamp"}', method='PUT'), timeout=30).read()
              time.sleep(30)
              ok = True
              for day, lab, n in moved:
                  v = dec(get('mp/' + day.replace('-', ''))['v'])['val']
                  if v.get('manual') or lab in (v.get('labels') or {}): ok = False
              print("::notice::attempt %d: server copy clean=%s" % (attempt + 1, ok))
              if ok: break
          chk = dec(get('mp/' + mid)['v'])['val']
          for day, lab, n in moved:
              print("::notice::moved %s %s x%s -> app record has %s" % (day, lab, n, json.dumps(chk.get(day, {}).get(lab))))
          PY
