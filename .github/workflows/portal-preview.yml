name: portal-preview
on: workflow_dispatch
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: pip install cryptography==43.0.3
      - name: Build data and portals (nothing is published)
        env:
          CHUSTER_DB_URL: ${{ secrets.CHUSTER_DB_URL }}
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
        run: |
          cd build-src
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ['CHUSTER_SECRETS'])
          s['sync']['url'] = os.environ['CHUSTER_DB_URL'].strip().rstrip('/'); json.dump(s['sync'], open('sync.json', 'w'))
          PY
          python3 tools/fetch_history.py "$CHUSTER_DB_URL" sync.json raw
          python3 -I tools/convert_raw.py raw export
          ASOF=$(python3 -c "import json;print(json.load(open('raw/meta.json'))['asOf'])")
          FROM=$(python3 -c "import json;print(json.load(open('raw/meta.json'))['from'])")
          mkdir -p build
          CHUSTER_NIGHTLY=1 sh tools/build_from.sh export build/data.json "$ASOF" "$FROM" > /dev/null
          python3 -I tools/build_portal.py raw build/data.json sync.json /tmp/site/c/d
          cp ../c/index.html ../c/logo.webp /tmp/site/c/; cp ../favicon-32.png /tmp/site/
          echo "::notice::files $(ls /tmp/site/c/d | wc -l), size $(du -sh /tmp/site/c/d | cut -f1), biggest $(ls -S /tmp/site/c/d | head -1 | xargs -I{} du -h /tmp/site/c/d/{} | cut -f1)"
          python3 - <<'PY'
          import base64, hashlib, hmac, json
          cfg = json.load(open('sync.json')); PS = hmac.new(base64.b64decode(cfg['key']), b'chuster-portal-v1', hashlib.sha256).digest()
          b64u = lambda b: base64.urlsafe_b64encode(b).decode().rstrip('=')
          name = 'Schreiber Cataring'
          fid = b64u(hmac.new(PS, ('id|1|' + name).encode(), hashlib.sha256).digest())[:22]; key = b64u(hmac.new(PS, ('key|1|' + name).encode(), hashlib.sha256).digest())
          open('/tmp/link.txt', 'w').write(fid + '.' + key)
          PY
          rm -f sync.json
      - name: Pictures
        run: |
          cd /tmp && npm init -y > /dev/null && npm i playwright@1.48.2 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          (cd /tmp/site && python3 -m http.server 8088 > /dev/null 2>&1 &)
          sleep 2
          cat > /tmp/shot.js <<'JS'
          const { chromium } = require('playwright'); const fs = require('fs');
          (async () => { const b = await chromium.launch(); const link = fs.readFileSync('/tmp/link.txt', 'utf8').trim(); const errs = [];
            const p = await (await b.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true })).newPage(); p.on('pageerror', e => errs.push(String(e)));
            await p.goto('http://localhost:8088/c/#' + link); await p.waitForTimeout(2500);
            await p.screenshot({ path: '/tmp/out/p1-statement.png', fullPage: true });
            await p.click('[data-tab=iv]'); await p.waitForTimeout(500); await p.screenshot({ path: '/tmp/out/p2-invoices.png', fullPage: true });
            await p.locator('[data-inv]').first().click(); await p.waitForTimeout(500); await p.screenshot({ path: '/tmp/out/p3-invoice.png' });
            await p.goto('http://localhost:8088/c/#' + link); await p.waitForTimeout(2000); await p.click('[data-tab=by]'); await p.waitForTimeout(500); await p.screenshot({ path: '/tmp/out/p4-buying.png', fullPage: true });
            const d = await (await b.newContext({ viewport: { width: 1200, height: 900 }, deviceScaleFactor: 1 })).newPage(); await d.goto('http://localhost:8088/c/#' + link); await d.waitForTimeout(2000); await d.screenshot({ path: '/tmp/out/p5-desktop.png', fullPage: true });
            const bad = await (await b.newContext({ viewport: { width: 390, height: 700 } })).newPage(); await bad.goto('http://localhost:8088/c/#AAAAAAAAAAAAAAAAAAAAAA.BBBB'); await bad.waitForTimeout(1500); await bad.screenshot({ path: '/tmp/out/p6-badlink.png' });
            console.log('errors', errs.join(' | ') || 'none'); await b.close(); })();
          JS
          mkdir -p /tmp/out && node /tmp/shot.js
      - uses: actions/upload-artifact@v4
        with: { name: portal-preview, path: /tmp/out, retention-days: 1 }
