name: portal-preview
on: workflow_dispatch
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: pip install cryptography==43.0.3
      - name: Build data and portals (nothing is published)
        env:
          CHUSTER_DB_URL: ${{ secrets.CHUSTER_DB_URL }}
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
        run: |
          cd build-src
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ['CHUSTER_SECRETS'])
          s['sync']['url'] = os.environ['CHUSTER_DB_URL'].strip().rstrip('/'); json.dump(s['sync'], open('sync.json', 'w'))
          PY
          python3 tools/fetch_history.py "$CHUSTER_DB_URL" sync.json raw
          python3 -I tools/convert_raw.py raw export
          ASOF=$(python3 -c "import json;print(json.load(open('raw/meta.json'))['asOf'])")
          FROM=$(python3 -c "import json;print(json.load(open('raw/meta.json'))['from'])")
          mkdir -p build
          CHUSTER_NIGHTLY=1 sh tools/build_from.sh export build/data.json "$ASOF" "$FROM" > /dev/null
          python3 -I tools/build_portal.py raw build/data.json sync.json /tmp/site/c/d
          cp ../c/index.html ../c/logo.webp /tmp/site/c/; cp ../favicon-32.png /tmp/site/
          echo "::notice::files $(ls /tmp/site/c/d | wc -l), size $(du -sh /tmp/site/c/d | cut -f1), biggest $(ls -S /tmp/site/c/d | head -1 | xargs -I{} du -h /tmp/site/c/d/{} | cut -f1)"
          python3 - <<'PY'
          import base64, hashlib, hmac, json
          cfg = json.load(open('sync.json')); PS = hmac.new(base64.b64decode(cfg['key']), b'chuster-portal-v1', hashlib.sha256).digest()
          b64u = lambda b: base64.urlsafe_b64encode(b).decode().rstrip('=')
          D = json.load(open('build/data.json'))
          mh = sorted([c for c in D['customers'] if c.get('rep') == 'MH' and (c.get('ytd') or 0) > 0], key=lambda c: -(c.get('ytd') or 0))
          name = mh[min(4, len(mh) - 1)]['name'] if mh else 'Schreiber Cataring'
          print('preview store:', name)
          fid = b64u(hmac.new(PS, ('id|1|' + name).encode(), hashlib.sha256).digest())[:22]; key = b64u(hmac.new(PS, ('key|1|' + name).encode(), hashlib.sha256).digest())
          open('/tmp/link.txt', 'w').write(fid + '.' + key)
          PY
          rm -f sync.json
      - name: Pictures
        run: |
          cd /tmp && npm init -y > /dev/null && npm i playwright@1.48.2 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          (cd /tmp/site && python3 -m http.server 8088 > /dev/null 2>&1 &)
          sleep 2
          cat > /tmp/shot.js <<'JS'
          const { chromium } = require('playwright'); const fs = require('fs');
          (async () => { const b = await chromium.launch(); const link = fs.readFileSync('/tmp/link.txt', 'utf8').trim(); const errs = [];
            const p = await (await b.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true })).newPage(); p.on('pageerror', e => errs.push(String(e)));
            p.on('console', m => m.type() === 'error' && errs.push('console: ' + m.text())); p.on('requestfailed', r => errs.push('failed: ' + r.url()));
            const W = t => p.waitForTimeout(t || 400), tall = h => p.setViewportSize({ width: 390, height: h || 844 });
            const shot = async (f, full) => { await W(); await p.screenshot({ path: '/tmp/out/' + f + '.png', fullPage: !!full }); };
            await p.goto('http://localhost:8088/c/?demo#' + link); await W(2500);
            await shot('01-home', true);
            await p.click('[data-tab=order]'); await shot('02-order', true);
            await p.click('[data-act=yt-fill]').catch(() => p.click('[data-act=again]')); await p.evaluate(() => window.scrollTo(0, 0)); await shot('03-order-filled');
            await tall(1100); await p.locator('[data-prod]').first().click(); await shot('04-product'); await p.click('[data-act=close-btn]');
            await p.click('[data-act=review]'); await shot('05-review'); await p.click('[data-act=send-order]'); await shot('06-sent'); await p.click('[data-act=close-btn]');
            await tall(); await p.click('[data-tab=acct]'); await shot('07-account', true);
            await tall(1100); await p.click('.acard [data-act=pay]'); await p.click('[data-act=pay-go]'); await shot('08-pay'); await p.click('[data-act=close-btn]');
            await tall(1300); await p.click('.acard [data-act=credit]'); await shot('09-credit'); await p.click('[data-act=close-btn]');
            await tall(1100); await p.click('.acard [data-act=year]'); await shot('10-year'); await p.click('[data-act=close-btn]');
            await tall(); await p.click('[data-tab=buy]'); await shot('11-buying', true);
            const d = await (await b.newContext({ viewport: { width: 1200, height: 900 }, deviceScaleFactor: 1 })).newPage(); await d.goto('http://localhost:8088/c/?demo#' + link); await d.waitForTimeout(2000); await d.screenshot({ path: '/tmp/out/12-desktop.png', fullPage: true });
            console.log('errors', errs.join(' | ') || 'none'); await b.close(); })();
          JS
          mkdir -p /tmp/out && ls /tmp/site/c | head && test -f /tmp/site/c/d/$(cut -d. -f1 /tmp/link.txt).json && echo FILE-OK; node /tmp/shot.js || true
      - name: Pictures into the log (artifacts can't be downloaded from here)
        if: always()
        run: |
          cd /tmp/out && for f in *.png; do base64 -w 0 "$f" | fold -w 8000 | sed "s/^/IMG:$f:/"; echo; done
