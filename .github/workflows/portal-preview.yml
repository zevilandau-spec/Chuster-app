name: portal-preview
on: workflow_dispatch
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install cryptography==43.0.3
      - name: Film probe (reads only)
        env:
          CHUSTER_DB_URL: ${{ secrets.CHUSTER_DB_URL }}
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
        run: |
          cd build-src
          python3 - <<'PY2'
          import json, os
          s = json.loads(os.environ['CHUSTER_SECRETS'])
          s['sync']['url'] = os.environ['CHUSTER_DB_URL'].strip().rstrip('/'); json.dump(s['sync'], open('sync.json', 'w'))
          PY2
          python3 tools/fetch_history.py "$CHUSTER_DB_URL" sync.json raw > /dev/null
          rm -f sync.json
          ls raw | tr '\n' ' '; echo
          python3 - <<'PY2'
          import json, glob, re, collections
          R = re.compile(r'film|roll|wrap|laminat|printed bag|poly', re.I)
          items = json.load(open('raw/items.json'))
          print('ITEM keys', sorted(items[0].keys()))
          for it in items:
              if R.search(it.get('n','') + ' ' + str(it.get('desc',''))):
                  print('ITEM', it.get('t'), '|', it.get('n'), '|', it.get('desc'), '| qoh', it.get('qoh'), '| cost', it.get('cost'), '| vendor', it.get('vendor'), '| active', it.get('active'))
          pur = []
          for f in sorted(glob.glob('raw/pur_*.json')): pur += json.load(open(f))
          print('PUR count', len(pur), 'keys', sorted(pur[0].keys()) if pur else '')
          vend = collections.Counter(); fv = collections.Counter()
          for t in pur:
              vend[t.get('v','')] += 1
              hit = [l for l in t.get('l', []) if R.search(str(l[0]) + ' ' + str(l[1]))] or ([['', t.get('memo','')]] if R.search(str(t.get('memo',''))) else [])
              if hit:
                  fv[t.get('v','')] += 1
                  if t['d'] >= '2025-01-01':
                      for l in hit: print('PUR', t['d'], t.get('t'), '|', t.get('v'), '|', t.get('n'), '|', json.dumps(l, ensure_ascii=False)[:220])
          print('FILM VENDORS', fv.most_common(20))
          print('ALL VENDORS', vend.most_common(80))
          po = json.load(open('raw/po.json')) if __import__('os').path.exists('raw/po.json') else []
          for p in po:
              for l in p.get('l', []):
                  if R.search(str(l[0]) + ' ' + str(l[1])): print('PO', p['d'], p.get('v'), json.dumps(l)[:200])
          PY2
