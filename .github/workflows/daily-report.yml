name: Daily full report
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Report date YYYY-MM-DD (blank = today, America/Chicago)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography==43.0.3
      - name: Build the full daily report
        env:
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
          CHUSTER_DB_URL: ${{ secrets.CHUSTER_DB_URL }}
          IN_DATE: ${{ github.event.inputs.date }}
          # --- Williamsburg coverage config ---
          WILLI_AREA_MATCH: "willi"          # area label substring (case-insensitive) that means Williamsburg
          WILLI_REP_CODES: "MH,MHC"          # salesman rep code(s) whose stores to check
        run: |
          set -e
          python3 - <<'PY'
          import os, json, base64, datetime, zoneinfo, urllib.request, subprocess, glob, re
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          S = json.loads(os.environ['CHUSTER_SECRETS'])['sync']
          db = (os.environ.get('CHUSTER_DB_URL') or S.get('url') or '').strip().rstrip('/')
          space, key = S['space'], base64.b64decode(S['key'])
          BASE = f"{db}/{space}"
          aes = AESGCM(key)

          CHI = zoneinfo.ZoneInfo('America/Chicago')
          NY = zoneinfo.ZoneInfo('America/New_York')
          target = (os.environ.get('IN_DATE') or '').strip() or datetime.datetime.now(CHI).date().isoformat()
          ny_today = datetime.datetime.now(NY).date().isoformat()
          print(f"::notice::Full report for {target}")

          # ---------- QuickBooks history ----------
          json.dump(S, open('sync.json', 'w'))
          subprocess.run(['python3', 'build-src/tools/fetch_history.py', db, 'sync.json', 'raw'], check=True)
          def raw_sets(prefix):
              out = []
              for p in sorted(glob.glob(f"raw/{prefix}_*.json")):
                  try: out.extend(json.load(open(p, encoding='utf-8')))
                  except Exception: pass
              return out
          def raw_one(name):
              p = f"raw/{name}.json"
              if not os.path.exists(p): return []
              d = json.load(open(p, encoding='utf-8'))
              if isinstance(d, dict):
                  for v in d.values():
                      if isinstance(v, list): return v
                  return []
              return d
          invs = raw_sets('inv'); custs = raw_one('customers')
          print(f"::notice::loaded {len(invs)} invoices, {len(custs)} customers")
          cust = {}
          for c in custs:
              area = (c.get('type') or '').replace('Retail:', '').replace('Cataring', 'Catering') or 'Other'
              act = c.get('active')
              cust[c.get('n', '')] = {'area': area, 'rep': (c.get('rep') or '—'), 'active': (act if act is not None else True)}

          # ---------- live encrypted collections ----------
          def coll(name):
              try:
                  raw_ = urllib.request.urlopen(f"{BASE}/{name}.json", timeout=60).read()
              except Exception as e:
                  print(f"::warning::could not read {name}: {e}"); return {}
              j = json.loads(raw_) or {}
              out = {}
              for _id, rec in (j.items() if isinstance(j, dict) else []):
                  if not rec or 'v' not in rec: continue
                  try:
                      b = base64.b64decode(rec['v']); o = json.loads(aes.decrypt(b[:12], b[12:], None))
                      out[o.get('k')] = o.get('val')
                  except Exception: pass
              return out
          sc = coll('sc'); tr_c = coll('tr'); lm = coll('lm'); ds = coll('ds'); ls = coll('ls'); vn = coll('vn')

          report = {'date': target, 'generatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat()}

          # ======================================================================
          # 1) PRODUCTION  (live box-printer data in mp.json)
          # ======================================================================
          def build_production():
              try:
                  raw = urllib.request.urlopen(f"{BASE}/mp.json", timeout=40).read()
                  data = json.loads(raw) or {}
              except Exception as e:
                  print(f"::warning::mp.json: {e}"); return {'total': 0, 'packs': 0, 'items': [], 'on': False}
              vals = {}
              for kid, rec in data.items():
                  if not isinstance(rec, dict) or 'v' not in rec: continue
                  try:
                      b = base64.b64decode(rec['v']); o = json.loads(aes.decrypt(b[:12], b[12:], None))
                      vals[o.get('k')] = o.get('val')
                  except Exception: pass
              day = vals.get(target) if isinstance(vals.get(target), dict) else (vals.get(ny_today) if isinstance(vals.get(ny_today), dict) else {})
              labels = (day or {}).get('labels', {}) or {}
              order = (day or {}).get('order') or list(labels.keys())
              mp_map = vals.get('map', {}) or {}; packmap = vals.get('packmap', {}) or {}; auto = vals.get('autoset', {}) or {}
              def nice(fullkey):
                  if not fullkey: return None
                  leaf = str(fullkey).split(':')[-1].strip()
                  leaf = re.sub(r'^\d+\s*', '', leaf)
                  leaf = re.sub(r'\s*(\d+\s*[/x]\s*[\d.]+.*|\d+\s*Lb|\d+\s*P(ac)?ks?.*)$', '', leaf, flags=re.I).strip()
                  return leaf or None
              items = []; tot = 0; totpk = 0; seen = set()
              for lab in list(order) + [l for l in labels if l not in order]:
                  if lab in seen or lab not in labels: continue
                  seen.add(lab); n = int(labels[lab] or 0)
                  if n <= 0: continue
                  k = mp_map.get(lab); per = int(packmap.get(k, 0) or 0) if k else 0
                  items.append({'label': lab, 'name': nice(k) or lab, 'boxes': n, 'packs': n * per})
                  tot += n; totpk += n * per
              items.sort(key=lambda x: -x['boxes'])
              return {'total': tot, 'packs': totpk, 'items': items, 'on': bool(auto.get('summary'))}
          report['production'] = build_production()
          pr = report['production']
          print(f"::notice::PRODUCTION {pr['total']} boxes, {pr['packs']} packs, {len(pr['items'])} products")

          # ======================================================================
          # 2) SALES  (invoices dated == target)
          # ======================================================================
          net = tax = 0.0; cnt = 0; by_area = {}; by_cust = {}
          for o in invs:
              if not isinstance(o, dict) or not o.get('n'): continue
              if (o.get('d') or '')[:10] != target: continue
              sub = float(o.get('sub', 0) or 0); tx = float(o.get('tax', 0) or 0)
              if sub + tx == 0: continue
              net += sub; tax += tx; cnt += 1
              area = cust.get(o.get('c', ''), {}).get('area', 'Other')
              by_area[area] = by_area.get(area, 0.0) + sub
              by_cust[o.get('c', '')] = by_cust.get(o.get('c', ''), 0.0) + sub
          report['sales'] = {
              'invoices': cnt, 'net': round(net, 2), 'tax': round(tax, 2), 'total': round(net + tax, 2),
              'byArea': sorted(({'area': a, 'net': round(v, 2)} for a, v in by_area.items()), key=lambda x: -x['net']),
              'topCustomers': sorted(({'name': c, 'net': round(v, 2)} for c, v in by_cust.items() if c), key=lambda x: -x['net'])[:6],
          }
          print(f"::notice::SALES {cnt} invoices | net ${net:,.2f} | total ${net+tax:,.2f}")

          # ======================================================================
          # 3) DELIVERIES  (same logic as delivery-summary)
          # ======================================================================
          def build_deliveries():
              dsched = sc.get('all') or {}
              trucks = tr_c.get('all') or [{'name': 'Truck 1', 'driver': ''}]
              nT = max(1, min(4, int(dsched.get('n') or 1)))
              trucks = (trucks or [])[:nT]
              while len(trucks) < nT: trucks.append({'name': f'Truck {len(trucks)+1}', 'driver': ''})
              def dsched_w(w): return dsched.get(str(w)) or dsched.get(w) or {}
              def dow(d): return (d.weekday() + 1) % 7
              def area_on(w, area, d):
                  m = dsched_w(w)
                  if m.get(area) is None: return False
                  season = (dsched.get('season') or {}).get(area)
                  if season and len(season): return d.month in [int(x) for x in season]
                  return True
              def ddate_auto(o):
                  area = cust.get(o['c'], {}).get('area', 'Other')
                  r0 = datetime.date.fromisoformat(o['d'][:10])
                  for k in range(0, 8):
                      d = r0 + datetime.timedelta(days=k)
                      if dow(d) == 6: continue
                      if area_on(dow(d), area, d): return d.isoformat()
                  return o['d'][:10]
              def ddate_of(o):
                  if lm.get(o.get('n')): return lm[o['n']][:10] if isinstance(lm[o['n']], str) else lm[o['n']]
                  return ddate_auto(o)
              def truck_for(area):
                  d = datetime.date.fromisoformat(target); m = dsched_w(dow(d))
                  if area_on(dow(d), area, d) and m.get(area) is not None: return min(int(m[area]), nT - 1)
                  return -1
              groups = {}
              for o in invs:
                  if not isinstance(o, dict) or not o.get('n'): continue
                  amt = float(o.get('sub', 0) or 0) + float(o.get('tax', 0) or 0)
                  if amt <= 0: continue
                  if ddate_of(o) != target: continue
                  shipd = o.get('ship'); shipkey = ''
                  if isinstance(shipd, dict): shipkey = ' '.join(str(x) for x in (shipd.get('a') or []))
                  gk = o['c'] + '\x01' + shipkey
                  g = groups.get(gk) or groups.setdefault(gk, {'c': o['c'], 'nums': []})
                  g['nums'].append(o['n'])
              out_trucks = {i: {'name': trucks[i]['name'], 'driver': (trucks[i].get('driver') or '').strip(), 'delivered': [], 'notDelivered': []} for i in range(nT)}
              out_trucks[-1] = {'name': 'Pick up', 'driver': '', 'delivered': [], 'notDelivered': []}
              for gk, g in groups.items():
                  nums = sorted(g['nums']); k = f"{target}|{nums[0]}"
                  area = cust.get(g['c'], {}).get('area', 'Other'); rep = cust.get(g['c'], {}).get('rep', '')
                  lsv = ls.get(k); st_rec = ds.get(k) or {}
                  if lsv and lsv != 'truck': t = -1
                  elif st_rec.get('truck') is not None: t = int(st_rec['truck'])
                  elif rep == 'PU': t = -1
                  else: t = truck_for(area)
                  if t not in out_trucks: t = -1
                  label = g['c'] + (f"  (#{' + '.join(nums)})" if len(nums) <= 3 else f"  ({len(nums)} invoices)")
                  stt = st_rec.get('st')
                  if stt in ('done', 'partial'):
                      at = (st_rec.get('at') or '')[11:16]; extra = f" — {at}" if at else ''
                      if stt == 'partial' and st_rec.get('shortTxt'): extra += f" (short: {st_rec['shortTxt']})"
                      out_trucks[t]['delivered'].append(label + extra)
                  else:
                      out_trucks[t]['notDelivered'].append(label + (' — marked not delivered' if stt == 'skip' else ''))
              res = {'trucks': [], 'totals': {'delivered': 0, 'notDelivered': 0}}
              for i in sorted(out_trucks.keys()):
                  tk = out_trucks[i]
                  if not tk['delivered'] and not tk['notDelivered']: continue
                  res['trucks'].append(tk)
                  res['totals']['delivered'] += len(tk['delivered']); res['totals']['notDelivered'] += len(tk['notDelivered'])
              return res
          report['deliveries'] = build_deliveries()
          dl = report['deliveries']
          print(f"::notice::DELIVERIES {dl['totals']['delivered']} delivered, {dl['totals']['notDelivered']} not")

          # ======================================================================
          # 4) WILLIAMSBURG COVERAGE  (salesman's Willi stores not covered today)
          # ======================================================================
          # ---- diagnostics: areas + rep codes, so config can be verified ----
          from collections import Counter
          area_ct = Counter(v['area'] for v in cust.values())
          rep_ct = Counter(v['rep'] for v in cust.values())
          print("::notice::AREAS " + ", ".join(f"{a}={n}" for a, n in area_ct.most_common(30)))
          print("::notice::REPS " + ", ".join(f"{r}={n}" for r, n in rep_ct.most_common(30)))

          area_match = (os.environ.get('WILLI_AREA_MATCH') or 'willi').lower()
          codes = [c.strip() for c in (os.environ.get('WILLI_REP_CODES') or '').split(',') if c.strip()]
          is_willi = lambda a: area_match in (a or '').lower()
          willi_all = {n for n, v in cust.items() if is_willi(v['area'])}
          print(f"::notice::WILLI area '{area_match}' matches {len(willi_all)} stores | rep filter {codes}")
          # williamsburg stores grouped by rep (to confirm which rep code is the salesman's)
          wrep = Counter(cust[n]['rep'] for n in willi_all)
          print("::notice::WILLI-by-rep " + ", ".join(f"{r}={n}" for r, n in wrep.most_common(20)))

          # invoices dated today, by customer (an order today = covered)
          ordered_today = set()
          for o in invs:
              if isinstance(o, dict) and o.get('c') and (o.get('d') or '')[:10] == target:
                  if float(o.get('sub', 0) or 0) + float(o.get('tax', 0) or 0) != 0:
                      ordered_today.add(o['c'])
          def visited_today(name):
              v = vn.get(name) or {}
              return isinstance(v, dict) and (v.get('visited') or '')[:10] == target

          mine = [n for n in willi_all if (not codes or cust[n]['rep'] in codes) and cust[n].get('active', True)]
          covered = []; notcov = []
          for n in sorted(mine):
              how = []
              if n in ordered_today: how.append('order')
              if visited_today(n): how.append('visit')
              (covered if how else notcov).append({'name': n, 'how': how, 'rep': cust[n]['rep'], 'area': cust[n]['area']})
          report['coverage'] = {
              'label': 'Williamsburg', 'repCodes': codes,
              'total': len(mine), 'covered': len(covered), 'notCovered': len(notcov),
              'notCoveredStores': [x['name'] for x in notcov],
              'coveredStores': [{'name': x['name'], 'how': x['how']} for x in covered],
          }
          print(f"::notice::COVERAGE Williamsburg {len(covered)}/{len(mine)} covered; NOT covered: " + (", ".join(report['coverage']['notCoveredStores']) or 'none'))

          os.makedirs('reports', exist_ok=True)
          json.dump(report, open('reports/daily-report.json', 'w'), indent=1)
          print("wrote reports/daily-report.json")
          PY
      - name: Commit the report
        run: |
          git config user.name "Chuster daily report"
          git config user.email "noreply@anthropic.com"
          git add reports/daily-report.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "Daily full report"
          for i in 1 2 3; do git push -q origin HEAD:main && break; git pull -q --rebase origin main; done
