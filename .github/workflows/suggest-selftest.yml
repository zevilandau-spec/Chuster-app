name: Suggest self-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for Q in "605 Budd Lake" "4706 10th Ave Brooklyn"; do
            code=$(curl -s -o r.json -w '%{http_code}' "https://chuster.netlify.app/suggest?q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$Q")")
            echo "::notice::/suggest '$Q' -> $code :: $(head -c 240 r.json)"
          done
