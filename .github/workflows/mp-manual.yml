name: Box printer - add boxes by hand
on:
  workflow_dispatch:
    inputs:
      day:   { description: 'Day (YYYY-MM-DD)', required: true }
      label: { description: 'Printer label exactly as the printer names it', required: true }
      n:     { description: 'Boxes', required: true }
      s:     { description: 'Start HH:MM (24h)', required: false, default: '' }
      e:     { description: 'Finish HH:MM (24h)', required: false, default: '' }
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Add to the day (kept by the server on every printer post)
        env:
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
          CHUSTER_DB_URL: ${{ secrets.CHUSTER_DB_URL }}
          DAY: ${{ inputs.day }}
          LAB: ${{ inputs.label }}
          N: ${{ inputs.n }}
          S: ${{ inputs.s }}
          E: ${{ inputs.e }}
        run: |
          pip install -q cryptography
          python3 - <<'PY'
          import json, os, base64, time, urllib.request
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          S = json.loads(os.environ['CHUSTER_SECRETS'])['sync']
          url = os.environ['CHUSTER_DB_URL'].strip().rstrip('/'); sp = S['space']; g = AESGCM(base64.b64decode(S['key']))
          day, lab, n, s, e = os.environ['DAY'], os.environ['LAB'].strip(), int(os.environ['N']), os.environ['S'].strip(), os.environ['E'].strip()
          path = f"{url}/{sp}/mp/{day.replace('-', '')}.json"
          def dec(v): raw = base64.b64decode(v); return json.loads(g.decrypt(raw[:12], raw[12:], None))
          def enc(o): iv = os.urandom(12); return base64.b64encode(iv + g.encrypt(iv, json.dumps(o).encode(), None)).decode()
          def get():
              d = json.load(urllib.request.urlopen(path, timeout=60)); return dec(d['v']) if d and d.get('v') else {'k': day, 'val': {'d': day, 'labels': {}, 'order': [], 'times': {}}, 'by': 'Printer'}
          for attempt in range(8):
              o = get(); val = o.get('val', {})
              val.setdefault('manual', {})[lab] = {'n': n, 's': s, 'e': e}
              val.setdefault('labels', {})
              if lab not in val['labels']:
                  val['labels'][lab] = n
                  val.setdefault('order', []).append(lab)
                  if s or e: val.setdefault('times', {})[lab] = {'s': s, 'e': e}
              o['val'] = val
              req = urllib.request.Request(path, data=json.dumps({'v': enc(o), 't': {'.sv': 'timestamp'}}).encode(), method='PUT')
              urllib.request.urlopen(req, timeout=60).read()
              urllib.request.urlopen(urllib.request.Request(f"{url}/{sp}/_t.json", data=b'{".sv":"timestamp"}', method='PUT'), timeout=30).read()
              time.sleep(30)   # let the printer PC post a few times, then check it stuck
              v = get().get('val', {})
              ok = lab in (v.get('manual') or {}) and v.get('labels', {}).get(lab)
              print("::notice::attempt %d: %s -> labels[%s]=%s times=%s manual=%s" % (attempt + 1, 'kept' if ok else 'not kept yet', lab, v.get('labels', {}).get(lab), json.dumps(v.get('times', {}).get(lab)), bool(v.get('manual'))))
              if ok: break
          else:
              raise SystemExit('The server did not keep the entry (new server code not live yet?)')
          PY
