name: Check database route
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try both routes to the shared database
        run: |
          for u in "https://chuster.netlify.app/db/c9f96489aaf0b6c66d4456571/qh.json?orderBy=%22t%22&startAt=0&limitToFirst=1"; do
            code=$(curl -s -o body.txt -w '%{http_code} %{content_type}' "$u")
            echo "::notice::$u -> $code :: $(head -c 120 body.txt | tr -d '\n\r')"
          done
      - name: The AI door
        run: |
          code=$(curl -s -o body.txt -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' https://chuster.netlify.app/ai/msg)
          echo "::notice::ai -> $code :: $(head -c 200 body.txt | tr -d '\n\r')"
          echo "::notice::version $(curl -s https://chuster.netlify.app/version.json)"
      - name: Is the AI key set (asks one tiny question)
        env:
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
        run: |
          TOK=$(python3 -c "import json,os,hmac,hashlib,base64;k=base64.b64decode(json.loads(os.environ['CHUSTER_SECRETS'])['sync']['key']);print(base64.b64encode(hmac.new(k,b'chuster-ai',hashlib.sha256).digest()).decode())")
          code=$(curl -s -o ai.txt -w '%{http_code}' -X POST https://chuster.netlify.app/ai/msg -H 'content-type: application/json' -H "x-chuster: $TOK" -d '{"model":"claude-haiku-5-5","max_tokens":20,"messages":[{"role":"user","content":"Say OK"}]}')
          echo "::notice::ai with code -> $code :: $(head -c 300 ai.txt | tr -d '\n\r')"
      - name: Map lookup for routes
        env:
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
        run: |
          TOK=$(python3 -c "import json,os,hmac,hashlib,base64;k=base64.b64decode(json.loads(os.environ['CHUSTER_SECRETS'])['sync']['key']);print(base64.b64encode(hmac.new(k,b'chuster-ai',hashlib.sha256).digest()).decode())")
          code=$(curl -s -o geo.txt -w '%{http_code}' -X POST https://chuster.netlify.app/geo -H 'content-type: application/json' -H "x-chuster: $TOK" -d '{"addrs":["4706 10th Ave, Brooklyn, NY 11219","232 Terhune Ave, Passaic, NJ 07055"]}')
          echo "::notice::geo -> $code :: $(head -c 300 geo.txt)"
      - name: When the office PC last checked in
        env:
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
        run: |
          SP=$(python3 -c "import json,os;print(json.loads(os.environ['CHUSTER_SECRETS'])['sync']['space'])")
          ST=$(curl -s "https://chuster.netlify.app/db/$SP/qh/status/t.json")
          MF=$(curl -s "https://chuster.netlify.app/db/$SP/hx/manifest/t.json")
          NOW=$(date +%s%3N)
          echo "::notice::pc-status-age-min=$(( (NOW - ${ST:-0}) / 60000 )) history-manifest-age-min=$(( (NOW - ${MF:-0}) / 60000 ))"
      - name: Office PC program version and self-update file
        env:
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
        run: |
          pip install -q cryptography
          echo "::notice::sig-site=$(curl -s https://chuster.netlify.app/qb/sync.sig | head -c 60) sig-repo=$(cat qb/sync.sig 2>/dev/null)"
          python3 - <<'PY'
          import json, os, base64, hmac, hashlib, urllib.request
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
          S = json.loads(os.environ['CHUSTER_SECRETS'])['sync']; k = base64.b64decode(S['key'])
          ek = hmac.new(k, b'chuster-qb-enc', hashlib.sha256).digest()
          r = json.load(urllib.request.urlopen('https://chuster.netlify.app/db/%s/qh/status.json' % S['space']))
          b = base64.b64decode(r['v'][3:]); iv, ct = b[:16], b[16:-32]
          d = Cipher(algorithms.AES(ek), modes.CBC(iv)).decryptor(); pt = d.update(ct) + d.finalize(); pt = pt[:-pt[-1]]
          v = json.loads(pt)['val']
          m = str(v.get('mail') or ''); print('::notice::pc ver=%s ok=%s at=%s err=%s mail=%s' % (v.get('ver'), v.get('ok'), v.get('at'), (v.get('err') or '')[:120], ':'.join(m.split(':')[:2]) if m.startswith('outlook') else m[:90]))
          import time
          q = json.load(urllib.request.urlopen('https://chuster.netlify.app/db/%s/qr.json?orderBy=%%22t%%22&startAt=%d' % (S['space'], int(time.time()*1000) - 86400000))) or {}
          for rv in q.values():
            b = base64.b64decode(rv['v'][3:]); iv, ct = b[:16], b[16:-32]
            d = Cipher(algorithms.AES(ek), modes.CBC(iv)).decryptor(); pt = d.update(ct) + d.finalize(); pt = pt[:-pt[-1]]
            val = json.loads(pt).get('val') or {}
            if val.get('was'): print('::notice::renumbered %s -> %s' % (val.get('was'), val.get('num')))
          print('::notice::results-24h=%d' % len(q))
          PY
      - name: How the other app talks to its server
        if: false
        run: |
          curl -s https://chusternoodle.netlify.app/ -o page.html
          echo "::notice::page: $(head -c 900 page.html | tr -d '\n\r')"
          for s in $(grep -oE '(src|href)="[^"]+\.(js|json|webmanifest)"' page.html | sed -E 's/.*="([^"]+)"/\1/'); do
            case "$s" in http*) u="$s";; /*) u="https://chusternoodle.netlify.app$s";; *) u="https://chusternoodle.netlify.app/$s";; esac
            curl -s "$u" -o f.js
            echo "::notice::file $u size $(wc -c < f.js)"
            hits=$(grep -oE "https?://[a-zA-Z0-9._/-]+|/\.netlify/functions/[a-zA-Z0-9_-]+|/api/[a-zA-Z0-9_/-]+|firebase[a-zA-Z]*|supabase|letsync[a-zA-Z.]*|wss?://[a-zA-Z0-9._/-]+" f.js | sort | uniq -c | sort -rn | head -40 | tr '\n' ' ')
            echo "::notice::in $s: $hits"
          done
          curl -s -o /dev/null -w '%{http_code}' https://chusternoodle.netlify.app/.netlify/functions/ ; echo
