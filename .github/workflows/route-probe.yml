name: route probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B='{"start":{"lat":40.9007,"lng":-74.6799},"stops":[{"lat":40.7033,"lng":-73.9586}],"truck":{"heightM":3.81,"weightKg":11793,"lengthM":7.32,"widthM":2.44,"axles":2}}'
          code=$(curl -s -o r.json -w '%{http_code}' -X POST https://chuster.netlify.app/route -H 'content-type: application/json' -d "$B")
          echo "::notice::status $code"
          python3 -c "import json;d=json.load(open('r.json'));print('ok',d.get('ok'),'routes',len(d.get('routes',[])),'| opt0:',[ (x['miles'],x['minutes'],len(x['steps'])) for x in d.get('routes',[])]);print('first 3 steps:',[ (s['text'][:40],s['road']) for s in d.get('steps',[])[:3]])"
