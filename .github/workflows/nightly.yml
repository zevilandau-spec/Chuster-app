name: Rebuild the app from QuickBooks
on:
  schedule:
    - cron: '17 * * * *'   # every hour: rebuild as soon as the office PC sent new QuickBooks history
  push:
    branches: [main]
    paths: ['build-src/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rebuild
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install cryptography==43.0.3
      - name: Build
        env:
          CHUSTER_DB_URL: ${{ secrets.CHUSTER_DB_URL }}
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
          CHUSTER_FORCE: ${{ github.event_name != 'schedule' }}
        run: |
          if [ -z "$CHUSTER_DB_URL" ] || [ -z "$CHUSTER_SECRETS" ]; then echo '{"result":"secrets missing"}' > build-status.json; exit 0; fi
          sh build-src/ci/nightly.sh > build-log.txt 2>&1 && R=ok || R=failed
          cat build-log.txt
          echo "::notice::nightly-log result=$R :: $(tail -6 build-log.txt | tr '\n' '|')"
          if grep -q -e UNCHANGED -e "No full history yet" build-log.txt; then rm -f build-log.txt; exit 0; fi
          H=$(cat build-src/history-at.txt 2>/dev/null || true); rm -f build-src/history-at.txt
          python3 -c "import json,sys,datetime; L=open('build-log.txt').read().strip().splitlines(); json.dump({'result': sys.argv[1], 'history': sys.argv[2], 'at': datetime.datetime.utcnow().isoformat(timespec='minutes') + 'Z', 'last': L[-8:]}, open('build-status.json','w'), indent=1)" "$R" "$H"
          rm -f build-log.txt
      - name: Publish
        run: |
          git config user.name "Chuster rebuild"
          git config user.email "actions@users.noreply.github.com"
          git add index.html version.json build-status.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "App rebuilt from QuickBooks history"
          # Push with retry. If another rebuild (schedule/push) landed first, re-base our
          # freshly generated files on top of theirs and try again. Never fail the run over
          # a race - that only spams the owner with "Run failed" mail; the next run catches up.
          for i in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then echo "pushed"; exit 0; fi
            echo "push rejected, syncing with latest (attempt $i)"
            git fetch origin main
            # keep only our three generated files; everything else comes from the latest main
            # (a soft reset here used to undo other commits made meanwhile, e.g. a new PC program signature)
            mkdir -p /tmp/ours && cp index.html version.json build-status.json /tmp/ours/
            git reset -q --hard origin/main
            cp /tmp/ours/index.html /tmp/ours/version.json /tmp/ours/build-status.json .
            git add index.html version.json build-status.json
            if git diff --cached --quiet; then echo "another run already rebuilt this - done"; exit 0; fi
            git commit -m "App rebuilt from QuickBooks history"
            sleep $((RANDOM % 5 + 2))
          done
          echo "could not push after retries; the next rebuild will catch up"
          exit 0
