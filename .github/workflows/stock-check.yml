name: Stock check (Toast Barley)
on: workflow_dispatch
jobs:
  chk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: pip install cryptography==43.0.3
      - name: Build data + inspect Toast Barley
        env:
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
          CHUSTER_DB_URL: ${{ secrets.CHUSTER_DB_URL }}
        run: |
          cd build-src
          python3 -c "import json,os;s=json.loads(os.environ['CHUSTER_SECRETS'])['sync'];s['sync' if 'sync' in s else 'space'];s['url']=os.environ['CHUSTER_DB_URL'].strip().rstrip('/');json.dump(s,open('sync.json','w'))" || true
          python3 tools/fetch_history.py "$CHUSTER_DB_URL" sync.json raw
          python3 -I tools/convert_raw.py raw export
          ASOF=$(python3 -c "import json;print(json.load(open('raw/meta.json'))['asOf'])")
          FROM=$(python3 -c "import json;print(json.load(open('raw/meta.json'))['from'])")
          mkdir -p build
          CHUSTER_NIGHTLY=1 sh tools/build_from.sh export build/data.json "$ASOF" "$FROM"
          python3 - <<'PY'
          import json,base64
          d=json.load(open('build/data.json'))
          print("::notice::asOf",d.get('asOf'),"snapAsOf",d.get('snapAsOf'))
          cat=d['catalog']
          print("::notice::=== products matching toast/toasted/barley ===")
          for c in cat:
              n=(c.get('name') or '')+' '+(c.get('full') or '')
              if any(w in n.lower() for w in ['toast','barley']):
                  print(f"::notice::name={c.get('name')!r} code={c.get('code')} stock={c.get('stock')} reorderAt={c.get('reorderAt')} full={c.get('full')!r}")
          # read the live label->product map
          S=json.loads(open('sync.json').read()); import urllib.request
          secrets=json.loads(__import__('os').environ['CHUSTER_SECRETS'])['sync']; space=secrets['space']; key=base64.b64decode(secrets['key'])
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          raw=urllib.request.urlopen(f"https://chuster.netlify.app/db/{space}/mp.json",timeout=20).read(); mp=json.loads(raw) or {}
          def dec(r): v=base64.b64decode(r['v']); return json.loads(AESGCM(key).decrypt(v[:12],v[12:],None))
          mapv={}
          for kid,r in mp.items():
              try: o=dec(r)
              except: continue
              if o.get('k')=='map': mapv=o.get('val') or {}
          print("::notice::=== label -> product for toasted labels ===")
          for lab,prod in mapv.items():
              if 'toast' in lab.lower(): print(f"::notice::label={lab!r} -> {prod!r}")
          PY
          rm -rf raw export build sync.json
