name: Dump product pack strings
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install cryptography==43.0.3
      - name: Build data.json and print catalog name/pack
        env:
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
          CHUSTER_DB_URL: ${{ secrets.CHUSTER_DB_URL }}
        run: |
          cd build-src
          python3 -c "import json,os;s=json.loads(os.environ['CHUSTER_SECRETS']);s['sync']['url']=os.environ['CHUSTER_DB_URL'].strip().rstrip('/');json.dump(s['sync'],open('sync.json','w'))"
          python3 tools/fetch_history.py "$CHUSTER_DB_URL" sync.json raw
          python3 -I tools/convert_raw.py raw export
          ASOF=$(python3 -c "import json;print(json.load(open('raw/meta.json'))['asOf'])")
          FROM=$(python3 -c "import json;print(json.load(open('raw/meta.json'))['from'])")
          mkdir -p build
          CHUSTER_NIGHTLY=1 sh tools/build_from.sh export build/data.json "$ASOF" "$FROM"
          python3 - <<'PY'
          import json
          d = json.load(open('build/data.json'))
          cat = d['catalog']
          print("::notice::catalog items:", len(cat))
          out = [{"name": c.get("name"), "group": c.get("group"), "pack": c.get("pack"), "full": c.get("full")} for c in cat]
          open('/tmp/packs.json','w').write(json.dumps(out, indent=0))
          for c in out:
              print(f"PACK|{c['group']}|{c['pack']}|{c['name']}  <<{c['full']}>>")
          PY
          rm -rf raw export build sync.json
      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: /tmp/packs.json
