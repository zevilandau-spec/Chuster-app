name: MP times check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Dump mp day docs (labels/order/times presence)
        env:
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
          CHUSTER_DB_URL: ${{ secrets.CHUSTER_DB_URL }}
        run: |
          pip install -q cryptography
          python3 - <<'PY'
          import json, os, base64, urllib.request
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          S = json.loads(os.environ['CHUSTER_SECRETS'])['sync']
          url = os.environ['CHUSTER_DB_URL'].strip().rstrip('/'); sp = S['space']; key = base64.b64decode(S['key'])
          g = AESGCM(key)
          def dec(v):
              raw = base64.b64decode(v); return json.loads(g.decrypt(raw[:12], raw[12:], None))
          mp = json.load(urllib.request.urlopen(f"{url}/{sp}/mp.json", timeout=120)) or {}
          print("::notice::mp keys = %s" % ', '.join(sorted(mp.keys())))
          days = sorted(k for k in mp if k.isdigit() and len(k) == 8)
          for kid in days[-8:]:
              try:
                  o = dec(mp[kid]['v']); val = o.get('val', {})
                  lab = val.get('labels', {}) or {}; order = val.get('order', []) or []; times = val.get('times', {}) or {}
                  samp = ''
                  if times:
                      fk = next(iter(times)); t = times[fk]; samp = "%s %s-%s" % (fk, t.get('s'), t.get('e'))
                  print("::notice::day %s  labels=%d order=%d times=%d  by=%s upd=%s  sample[%s]" % (
                      val.get('d'), len(lab), len(order), len(times), o.get('by'), val.get('upd'), samp))
              except Exception as e:
                  print("::notice::day key %s  ERROR %s" % (kid, e))
          PY
