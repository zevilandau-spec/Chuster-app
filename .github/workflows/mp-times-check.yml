name: MP times check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Dump mp docs
        env:
          CHUSTER_SECRETS: ${{ secrets.CHUSTER_SECRETS }}
          CHUSTER_DB_URL: ${{ secrets.CHUSTER_DB_URL }}
          FIND: ${{ vars.FIND || 'enne' }}
        run: |
          pip install -q cryptography
          python3 - <<'PY'
          import json, os, base64, urllib.request
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          S = json.loads(os.environ['CHUSTER_SECRETS'])['sync']
          url = os.environ['CHUSTER_DB_URL'].strip().rstrip('/'); sp = S['space']; key = base64.b64decode(S['key'])
          g = AESGCM(key); F = 'enne'
          def dec(v):
              raw = base64.b64decode(v); return json.loads(g.decrypt(raw[:12], raw[12:], None))
          mp = json.load(urllib.request.urlopen(f"{url}/{sp}/mp.json", timeout=120)) or {}
          days = sorted(k for k in mp if k.isdigit() and len(k)==8)
          for kid in days[-2:]:
              val = dec(mp[kid]['v']).get('val', {}); t = val.get('times', {}) or {}
              print("::notice::day %s labels=%d order=%d times=%d manual=%s upd=%s" % (val.get('d'), len(val.get('labels',{}) or {}), len(val.get('order',[]) or []), len(t), json.dumps(val.get('manual')), val.get('upd')))
          seen = {}
          for kid in days:
              for lab, n in (dec(mp[kid]['v']).get('val', {}).get('labels', {}) or {}).items():
                  if F in lab.lower(): seen.setdefault(lab, []).append("%s:%s" % (kid, n))
          for lab, v in seen.items(): print("::notice::label %s seen %s" % (lab, ' '.join(v[-5:])))
          for kid in mp:
              try: o = dec(mp[kid]['v'])
              except Exception: continue
              if o.get('k') == 'map':
                  for lab, pk in sorted((o.get('val') or {}).items()):
                      if F in lab.lower() or F in json.dumps(pk).lower(): print("::notice::map %s => %s" % (lab, json.dumps(pk)))
                  print("::notice::map-size %d" % len(o.get('val') or {}))
          PY
