# Chuster app: plain files, no build step. Phones always get the newest app.
[build]
  publish = "."
  # only publish when the app itself changed (saves Netlify credits)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html version.json netlify.toml manifest.webmanifest *.png"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# The shared database through the app's own address, for phones whose internet filter blocks firebaseio.com
[[redirects]]
  from = "/db/*"
  to = "https://chuster-afb77-default-rtdb.firebaseio.com/:splat"
  status = 200
  force = true
