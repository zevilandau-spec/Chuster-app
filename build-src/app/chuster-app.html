<title>Chuster Noodle App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: office sidebar app on wide screens; on phones a top bar, a slide-in menu and a bottom tab bar. Navy + gold from the Chuster portal. */
:root {
  --bg: #FBF8EF; --surface: #FFFFFF; --surface-2: #F5EFDD; --line: #ECE4CF; --line-strong: #D8CCAB;
  --fg: #16204A; --muted: #5F5A4E;
  --brand: #21409A; --brand-ink: #FFFFFF; --brand-soft: #DFE6F8; --brand-text: #21409A; --hero: #21409A;
  --gold: #F4BC3A; --gold-ink: #16204A; --gold-soft: #FFF3D2; --gold-text: #6E4300;
  --brown: #753A27; --cream: #FFF3C4;
  --good: #1E7A45; --good-soft: #E3F3E8; --good-text: #1E6B3A;
  --bad: #B42318; --bad-soft: #FEECEB; --bad-text: #8A1C12;
  --pink-soft: #F9DDF3; --pink-text: #5B2350;
  --closed: #E4E7EE; --closed-text: #343B4B;
  --tan-soft: #F3ECE2; --tan: #E6D7C2;
  --side: #21409A; --side-ink: #FFFFFF; --side-muted: #CDD7F6; --side-active: #F4BC3A; --side-active-ink: #16204A;
  --chart-a: #21409A; --chart-b: #C98E12; --chart-grid: #E3E7EF; --bar-muted: #D5D9E6;
  --g1: #2F55C8; --g1s: #E4EBFB; --g2: #1B7A4B; --g2s: #E1F3E8; --g3: #A35408; --g3s: #FBEBD8;
  --g4: #A8327A; --g4s: #FAE3F1; --g5: #6B46C1; --g5s: #ECE6FA; --g6: #0E6E77; --g6s: #DDF2F3;
  --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131D; --surface: #171D2B; --surface-2: #1F2738; --line: #283146; --line-strong: #39445E;
    --fg: #E8EBF3; --muted: #A4ABBC;
    --brand: #3354C2; --brand-ink: #FFFFFF; --brand-soft: #22305E; --brand-text: #A9BBFF; --hero: #1A2D6E;
    --gold: #F4BC3A; --gold-ink: #16204A; --gold-soft: #362C13; --gold-text: #F2CF7A;
    --good: #1E7A45; --good-soft: #15361F; --good-text: #86D9A8;
    --bad: #E5534B; --bad-soft: #3B1A1A; --bad-text: #FFA29B;
    --pink-soft: #3A2136; --pink-text: #F4BCE6;
    --closed: #232A3A; --closed-text: #BFC6D4;
    --tan-soft: #2B261F; --tan: #46392A;
    --side: #14245E; --side-ink: #E8EBF3; --side-muted: #A9B4D6; --side-active: #F4BC3A; --side-active-ink: #16204A; --brown: #B8714F; --cream: #3A3220;
    --g1s: #1D2A4F; --g2s: #14352A; --g3s: #3A2914; --g4s: #3A1B30; --g5s: #2A2148; --g6s: #12363A; --chart-a: #8EA3F2; --chart-b: #E8B33A; --chart-grid: #283146; --bar-muted: #39445E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131D; --surface: #171D2B; --surface-2: #1F2738; --line: #283146; --line-strong: #39445E;
  --fg: #E8EBF3; --muted: #A4ABBC;
  --brand: #3354C2; --brand-ink: #FFFFFF; --brand-soft: #22305E; --brand-text: #A9BBFF; --hero: #1A2D6E;
  --gold: #F4BC3A; --gold-ink: #16204A; --gold-soft: #362C13; --gold-text: #F2CF7A;
  --good: #1E7A45; --good-soft: #15361F; --good-text: #86D9A8;
  --bad: #E5534B; --bad-soft: #3B1A1A; --bad-text: #FFA29B;
  --pink-soft: #3A2136; --pink-text: #F4BCE6;
  --closed: #232A3A; --closed-text: #BFC6D4;
  --tan-soft: #2B261F; --tan: #46392A;
  --side: #14245E; --side-ink: #E8EBF3; --side-muted: #A9B4D6; --side-active: #F4BC3A; --side-active-ink: #16204A; --brown: #B8714F; --cream: #3A3220;
  --g1s: #1D2A4F; --g2s: #14352A; --g3s: #3A2914; --g4s: #3A1B30; --g5s: #2A2148; --g6s: #12363A; --chart-a: #8EA3F2; --chart-b: #E8B33A; --chart-grid: #283146; --bar-muted: #39445E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
a { color: var(--brand-text); }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); }
.side { box-shadow: inset -3px 0 0 var(--gold), inset -6px 0 0 var(--brown); background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; gap: 14px; padding-block: 22px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.logo { width: 44px; height: 44px; flex: none; border-radius: 22px; background: var(--gold); color: #22378C; display: grid; place-items: center; font-weight: 800; font-size: 20px; }
.brand b { display: block; font-size: 19px; line-height: 1.1; }
.brand small { color: var(--side-muted); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav h3 { margin: 14px 12px 4px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--side-muted); }
.nav a { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; border-radius: 10px; color: var(--side-ink); text-decoration: none; font-weight: 600; font-size: 14px; }
.nav a:hover { background: rgba(255,255,255,0.08); }
.nav a[aria-current="page"] { background: var(--side-active); color: var(--side-active-ink); font-weight: 800; }
.nav a .soon { margin-left: auto; font-size: 10px; font-weight: 800; letter-spacing: 0.05em; color: var(--side-muted); border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; padding: 1px 6px; }
.nav a .count { margin-left: auto; background: var(--bad-soft); color: var(--bad-text); font-size: 11px; font-weight: 800; border-radius: 10px; padding: 2px 8px; }
.nav svg, .tabs svg, .icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.side-foot { margin-top: auto; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; font-size: 12px; color: var(--side-muted); line-height: 1.5; }
.side-foot b { color: var(--side-ink); display: block; font-size: 13px; }

.topbar { border-bottom: 3px solid var(--gold); box-shadow: 0 3px 0 var(--brown); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--side); color: var(--side-ink); display: flex; align-items: center; gap: 8px; padding-block: 8px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.topbar .t { flex: 1; min-width: 0; }
.topbar .t b { display: block; font-size: 17px; }
.topbar .t small { color: var(--side-muted); font-size: 12px; }
.icon-btn { width: 44px; height: 44px; border: none; background: transparent; color: inherit; display: grid; place-items: center; border-radius: 10px; cursor: pointer; }
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--side); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs a, .tabs button { flex: 1; min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--muted); text-decoration: none; background: none; border: none; cursor: pointer; }
.tabs svg { width: 22px; height: 22px; }
.tabs [aria-current="page"] { color: var(--brand-text); font-weight: 800; }

.scrim { position: fixed; inset: 0; background: rgba(10,14,25,0.45); z-index: 35; }
main { min-width: 0; padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.topnav { display: none; }
@media (min-width: 960px) {
  /* menu on the left side again (the top menu is kept but switched off) */
  .app { grid-template-columns: 252px minmax(0, 1fr); }
  .side { position: sticky; top: 0; height: 100vh; }
  .topbar, .tabs, .scrim { display: none !important; }
  .menu-close { display: none; }
  .topnav.on-top { display: flex; position: sticky; top: 0; z-index: 25; align-items: center; gap: 4px; background: var(--side); color: var(--side-ink); padding: 8px 20px; border-bottom: 3px solid var(--gold); box-shadow: 0 3px 0 var(--brown); }
  .topnav .tn-logo { width: 96px; margin-right: 10px; cursor: pointer; }
  .topnav .tn-list { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
  .topnav a.tn, .topnav summary { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 12px; border-radius: 10px; color: var(--side-ink); text-decoration: none; font-weight: 700; font-size: 14px; cursor: pointer; list-style: none; white-space: nowrap; }
  .topnav summary::-webkit-details-marker { display: none; }
  .topnav summary::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translate(-2px, -2px); opacity: .8; }
  .topnav a.tn:hover, .topnav summary:hover, .topnav details[open] > summary { background: rgba(255,255,255,0.12); }
  .topnav .on > summary, .topnav a.tn.on { background: var(--side-active); color: var(--side-active-ink); }
  .topnav details { position: relative; }
  .topnav .tn-menu { position: absolute; top: calc(100% + 8px); left: 0; min-width: 250px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 12px; box-shadow: 0 12px 30px rgba(15,20,35,0.18); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .topnav .tn-menu a { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; border-radius: 8px; color: var(--fg); text-decoration: none; font-weight: 600; font-size: 14px; }
  .topnav .tn-menu a:hover { background: var(--surface-2); }
  .topnav .tn-menu a[aria-current="page"] { background: var(--gold-soft); font-weight: 800; }
  .topnav .tn-menu a .count, .topnav .count { margin-left: auto; background: var(--bad-soft); color: var(--bad-text); font-size: 11px; font-weight: 800; border-radius: 10px; padding: 2px 8px; }
  .topnav .tn-menu a .soon { margin-left: auto; font-size: 10px; font-weight: 800; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 6px; padding: 1px 6px; }
  .topnav .tn-right { display: flex; align-items: center; gap: 6px; }
  .topnav .tn-right .btn { min-height: 40px; }
  .topnav .icon-btn { color: var(--side-ink); }
  .topnav .tn-date { font-size: 12px; color: var(--side-muted); text-align: right; line-height: 1.3; margin-right: 6px; white-space: nowrap; }
  @media (max-width: 1480px) { .topnav .tn-date { display: none; } }
  @media (max-width: 1400px) { .topnav .tn-hide { display: none; } .topnav a.tn, .topnav summary { padding: 0 9px; } }
  main { padding-block: 28px 48px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }
  .menu-close { display: none; }
}
@media (max-width: 959px) {
  .side { position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); z-index: 40; transform: translateX(-105%); transition: transform 0.22s ease; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .app.menu-open .side { transform: none; }
  /* phone menu: boxes, 3 across */
  .side { width: 100vw; box-shadow: none; }
  .nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .nav h3 { grid-column: 1 / -1; margin: 12px 4px 0; }
  .nav a { position: relative; flex-direction: column; justify-content: center; gap: 7px; min-height: 86px; padding: 12px 6px; text-align: center; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.13); border-radius: 14px; font-size: 12.5px; line-height: 1.2; overflow-wrap: anywhere; }
  .nav a svg { width: 26px; height: 26px; color: var(--gold); }
  .nav a[aria-current="page"] { border-color: transparent; }
  .nav a[aria-current="page"] svg { color: currentColor; }
  .nav a .count { position: absolute; top: 6px; right: 6px; margin: 0; }
  main { padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
  .page-head h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* ---------- parts ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.page-head > div:first-child { flex: 1 1 240px; min-width: 0; }
.page-head h1 { font-size: 28px; font-weight: 800; }
.sub { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.card h2 { font-size: 16px; font-weight: 800; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; }
.split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 1100px) { .split { grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); } .split.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.tile .k { font-size: 13px; color: var(--muted); font-weight: 700; }
.tile .v { font-size: 28px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 13px; color: var(--muted); }
.tile.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad-text); }
.tile.bad .k, .tile.bad .s { color: var(--bad-text); }
.tile.good { background: var(--good-soft); border-color: transparent; color: var(--good-text); }
.tile.good .k, .tile.good .s { color: var(--good-text); }
.tile.warn { background: var(--gold-soft); border-color: transparent; color: var(--gold-text); }
.tile.warn .k, .tile.warn .s { color: var(--gold-text); }
.tile .row2 { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.tile .row2 strong { font-size: 18px; font-variant-numeric: tabular-nums; }

.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; font: 700 14px var(--font); border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; white-space: nowrap; }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.btn.gold { background: var(--gold); color: var(--gold-ink); font-weight: 800; }
.btn.ghost { background: var(--surface); color: var(--brand-text); border-color: var(--line-strong); }
.btn.good { background: var(--good); color: #FFFFFF; font-weight: 800; }
.btn.pink { background: var(--pink-soft); color: var(--pink-text); font-weight: 800; }
.btn.danger { background: var(--surface); color: var(--bad-text); border-color: var(--line-strong); }
.btn.big { min-height: 54px; font-size: 16px; border-radius: 14px; }
.btn.full { width: 100%; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 13px; }
.btn[disabled] { opacity: 0.55; cursor: default; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font: 600 13px var(--font); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 800; }
.chip.closed { background: var(--closed); color: var(--closed-text); border-color: transparent; cursor: default; }
.chip small { font-weight: 600; opacity: 0.85; }
.tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 800; border-radius: 7px; padding: 3px 8px; }
.tag.blue { background: var(--brand-soft); color: var(--brand-text); }
.tag.red { background: var(--bad-soft); color: var(--bad-text); }
.tag.gold { background: var(--gold-soft); color: var(--gold-text); }
.tag.green { background: var(--good-soft); color: var(--good-text); }
.tag.grey { background: var(--surface-2); color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--brand); }
.bar.good > i { background: var(--good); }
.bar.gold > i { background: var(--gold); }

.step { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); flex: none; }
.step button { width: 42px; height: 42px; border: none; background: transparent; color: var(--brand-text); font: 800 19px var(--font); cursor: pointer; border-radius: 10px; }
.step input.oq-inp { width: 52px; height: 42px; border: none; border-inline: 1px solid var(--line); background: transparent; color: var(--fg); text-align: center; font: 800 17px var(--font); font-variant-numeric: tabular-nums; padding: 0; border-radius: 0; }
.step input.oq-inp:focus { outline: 2px solid var(--gold); background: var(--gold-soft); }
.step input.oq-inp::placeholder { color: var(--muted); opacity: .6; }
.step output { min-width: 34px; text-align: center; font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.check { width: 44px; height: 44px; flex: none; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--good-text); font: 800 18px var(--font); cursor: pointer; }
.check[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #FFFFFF; }

.list { display: flex; flex-direction: column; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: none; }
.row .main { flex: 1 1 200px; min-width: 0; }
.row .name { font-weight: 800; font-size: 15px; }
.row .meta { font-size: 13px; color: var(--muted); }
.field { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 12px; min-height: 46px; background: var(--surface); }
.field input, .field select { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--fg); font: 600 15px var(--font); min-height: 44px; }
label.lbl { font-size: 13px; font-weight: 800; color: var(--muted); }
select.sel, input.inp { min-height: 46px; border-radius: 10px; border: 1px solid var(--line-strong); padding: 0 10px; font: 600 15px var(--font); background: var(--surface); color: var(--fg); width: 100%; }

.note { background: var(--gold-soft); color: var(--gold-text); border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
.note strong { color: inherit; }
.sample { font-size: 12px; color: var(--muted); }

/* dashboard */
.brief { background: var(--gold-soft); border: 1px solid transparent; border-radius: var(--radius); padding: 14px 18px; font-size: 15px; line-height: 1.65; color: var(--fg); }
.brief a { font-weight: 700; }
.brief .red { color: var(--bad-text); }
.hero { background: var(--hero); color: #FFFFFF; border-radius: 18px; padding: 20px 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
.hero .who { flex: 1 1 220px; }
.hero .who b { font-size: 24px; display: block; }
.hero small, .hero .soft { color: #CFD8F5; }
.hero .goal { display: flex; align-items: center; gap: 14px; flex: 1 1 280px; }
.hero .goal .lbl2 { font-size: 12px; font-weight: 800; letter-spacing: 0.07em; color: #CFD8F5; }
.hero .goal .amt { font-size: 26px; font-weight: 800; }
.hero .quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; flex: 1 1 260px; max-width: 320px; }

.ps { background: #FFFFFF; color: #16204A; max-width: 820px; margin: 0 auto; padding: 28px 30px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.12); font: 14px/1.4 var(--font); }
.ps-top { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; }
.ps-logo { width: 44px; height: 44px; border-radius: 10px; background: #1F4E8C; color: #FFFFFF; font-weight: 900; font-size: 22px; display: grid; place-items: center; flex: none; }
.ps-co { font-size: 22px; font-weight: 900; letter-spacing: -0.01em; }
.ps-contact, .ps-date { font-size: 13px; color: #5A6273; }
.ps-title { font-size: 20px; font-weight: 800; color: #21409A; }
.ps-for { margin-top: 10px; font-size: 14px; }
.ps-t { width: 100%; border-collapse: collapse; margin-top: 12px; }
.ps-t th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #5A6273; padding: 6px 8px; border-bottom: 1px solid #C9CED8; }
.ps-t td { padding: 6px 8px; border-bottom: 1px solid #E6E9EF; }
.ps-t .ps-p { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.ps-code { font-variant-numeric: tabular-nums; color: #5A6273; width: 52px; }
.ps-g td { background: var(--gt); color: #FFFFFF; font-weight: 800; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 7px 8px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.ps-t tr { break-inside: avoid; }
.ps-foot { margin-top: 14px; font-size: 12px; color: #5A6273; }
#print-sheet { display: none; }
@media print {
  @page { margin: 12mm; }
  body { background: #FFFFFF !important; }
  #app, .toast, #lock { display: none !important; }
  #print-sheet { display: block !important; }
  #print-sheet .ps { box-shadow: none; padding: 0; max-width: none; }
}

.brand-logo { display: block; background: var(--logo) center / contain no-repeat; aspect-ratio: 480 / 271; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.brand .brand-logo { width: 150px; }
.topbar .brand-logo { width: 62px; flex: none; }

.ps-logo-img { width: 120px; flex: none; }
.ps-top { border-bottom: 3px solid #F4BC3A !important; box-shadow: 0 3px 0 #753A27; }
.ps-parties { display: flex; flex-wrap: wrap; gap: 14px 40px; margin-top: 16px; font-size: 14px; }
.ps-k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #5F5A4E; font-weight: 800; margin-bottom: 2px; }
.ps-tot { margin: 10px 0 0 auto; max-width: 340px; }
.ps-tot div { display: flex; justify-content: space-between; gap: 16px; padding: 4px 8px; font-variant-numeric: tabular-nums; }
.ps-tot div.big { background: #21409A; color: #FFFFFF; border-radius: 6px; font-size: 16px; padding: 8px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.ps-late td { background: #FEF1F0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

/* dashboard v3: gold top box like the logo, light colored number boxes */
:root { --ct-blue-bg: #E7EDFC; --ct-blue: #21409A; --ct-green-bg: #E2F3E8; --ct-green: #17663B; --ct-red-bg: #FDEBE9; --ct-red: #A3241A; --ct-gold-bg: #F6ECE3; --ct-gold: #753A27; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ct-blue-bg: #1C2A55; --ct-blue: #AFC0FF; --ct-green-bg: #15372A; --ct-green: #8FDCAE; --ct-red-bg: #3D1C1A; --ct-red: #FFA9A1; --ct-gold-bg: #3A2A20; --ct-gold: #E9B999; } }
:root[data-theme="dark"] { --ct-blue-bg: #1C2A55; --ct-blue: #AFC0FF; --ct-green-bg: #15372A; --ct-green: #8FDCAE; --ct-red-bg: #3D1C1A; --ct-red: #FFA9A1; --ct-gold-bg: #3A2A20; --ct-gold: #E9B999; }
/* dashboard number boxes: calm white with a thin gold line */
.tile.ct { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); }
.tile.ct .v, .tile.ct .row2 strong { color: var(--fg); }
.hero { background: linear-gradient(120deg, #FFF3C4 0%, #FFD86E 45%, #F4BC3A 100%); color: #16204A; border: 3px solid #E3A73A; box-shadow: 4px 4px 0 #753A27; }
.hero small, .hero .soft, .hero .goal .lbl2 { color: #5A3D10; }
.hero .goal .lbl2 { color: #753A27; }
.hero .quick .btn.gold { background: #21409A; color: #FFFFFF; }
.hero .quick .btn.line { background: rgba(255,255,255,0.55); color: #16204A; border-color: rgba(22,32,74,0.35); }
.hero svg circle:first-of-type { stroke: rgba(22,32,74,0.14); }
.hero svg circle:nth-of-type(2) { stroke: #21409A; }
.hero svg text { fill: #16204A; }
.brief { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--brand); }

/* Chuster logo, full color, in the big box */
.hero .who { display: flex; align-items: center; gap: 14px; }
.hero .who::before { content: ""; flex: none; width: 128px; aspect-ratio: 480 / 271; background: var(--logo) center / contain no-repeat; filter: drop-shadow(0 2px 3px rgba(117,58,39,0.35)); }
.hero .who b { font-size: 24px; }
@media (max-width: 700px) { .hero .who::before { width: 104px; } }
.hero > * { position: relative; z-index: 1; }

/* salesman dashboard hero: blue */
.hero.ms-hero { background: linear-gradient(120deg, #1B3585 0%, #21409A 55%, #2C52BE 100%); color: #FFFFFF; border: none; box-shadow: none; border-bottom: 4px solid var(--gold); }
.hero.ms-hero .who::before { display: none; }
.hero.ms-hero small, .hero.ms-hero .soft { color: #CFD8F5; }
.hero.ms-hero .quick .btn.gold { background: var(--gold); color: #16204A; }
.hero.ms-hero .quick .btn.line { background: transparent; color: #FFFFFF; border-color: rgba(255,255,255,0.4); }

/* Dudi's dashboard: gold box like the main dashboard, logo next to the name */
.hero.ms-gold .who::before { display: block; }
.hero.ms-gold .quick .btn.gold { background: #21409A; color: #FFFFFF; }
@media (max-width: 959px) { .ll-stops { order: -1; } }
/* ---------- Loading (lx) ---------- */
.lx { display: flex; flex-direction: column; gap: 10px; max-width: 760px; margin: 0 auto; width: 100%; }
.lx svg, .lx-sheet svg, .lx-selbar svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.lx-dh { display: none; margin: 0; font-size: 28px; }
@media (min-width: 960px) { .lx-dh { display: block; } }
.lx-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lx-tbtn { color: var(--muted); }
.lx-tbtn.on { color: var(--brand-text); background: var(--brand-soft); }
.lx-date { white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; border: none; background: var(--brand-soft); color: var(--brand-text); font: 800 15px/1 var(--body, inherit); padding: 10px 16px; border-radius: 999px; cursor: pointer; }
.lx-live { background: var(--good); color: #FFFFFF; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 3px 6px; }
.lx-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(64px, 1fr); gap: 2px; background: var(--surface-2); border-radius: 14px; padding: 4px; overflow-x: auto; scrollbar-width: none; }
.lx-tabs::-webkit-scrollbar { display: none; }
.lx-tabs button { border: none; background: transparent; border-radius: 10px; padding: 7px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; color: var(--fg); font: inherit; min-width: 0; }
.lx-tabs button b { font-size: 13px; font-weight: 700; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.lx-tabs button span { font-size: 11px; color: var(--muted); }
.lx-tabs button[aria-selected="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(22, 32, 74, .14); }
.lx-tabs button[aria-selected="true"] b { color: var(--brand-text); font-weight: 800; }
.lx-prog { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: -4px; }
.lx-prog i { display: block; height: 100%; background: var(--good); transition: width .3s; }
.lx-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.lx-tiles3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.lx-tiles > * { border: none; border-left: 1px solid var(--line); background: transparent; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; color: var(--fg); cursor: pointer; min-width: 0; }
.lx-tiles > div { cursor: default; }
.lx-tiles > *:first-child { border-left: none; }
.lx-tiles b { font-size: 24px; font-weight: 800; line-height: 1.1; }
.lx-tiles span { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.lx-tiles small { font-size: 10.5px; font-weight: 700; color: var(--gold-text); text-align: center; }
.lx-tiles [aria-pressed="true"] { background: var(--brand-soft); }
.lx-tiles [aria-pressed="true"] b { color: var(--brand-text); }
.lx-loaded b { color: var(--good-text); }
.lx-lock, .lx-donebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.lx-lock { background: var(--gold-soft); color: var(--gold-text); }
.lx-donebar { background: var(--good-soft); color: var(--good-text); font-weight: 800; }
.lx-search { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 999px; padding: 0 14px; color: var(--muted); }
.lx-search input { flex: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 15px; color: var(--fg); padding: 11px 0; outline: none; }
.lx-search:focus-within { box-shadow: 0 0 0 3px var(--gold); }
.lx-empty { text-align: center; padding: 24px 8px; margin: 0; }
.lx-stop { display: flex; align-items: stretch; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 12px 12px 14px; }
.lx-stop.full { background: var(--good-soft); }
.lx-stop.sel { box-shadow: 0 0 0 2px var(--brand); }
.lx-cb { flex: none; align-self: center; width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--line-strong); background: var(--surface); color: #FFFFFF; font-weight: 900; cursor: pointer; display: grid; place-items: center; padding: 0; }
.lx-cb.on { background: var(--brand); border-color: var(--brand); }
.lx-smain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.lx-sname { border: none; background: none; padding: 0; text-align: left; font: inherit; font-size: 16px; font-weight: 800; color: var(--fg); cursor: pointer; }
.lx-smain > b { font-size: 16px; }
.lx-addr { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lx-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 3px; }
.lx-inv { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 2px 7px; font: 700 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); cursor: pointer; }
.lx-area { font-size: 11px; font-weight: 800; letter-spacing: .05em; color: var(--brand-text); }
.lx-type { font-size: 11px; font-weight: 800; border-radius: 6px; padding: 2px 7px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.lx-typebtn { cursor: pointer; font-family: inherit; }
.lx-who { font-size: 11px; font-weight: 800; color: var(--good-text); }
.lx-scount { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex: none; }
.lx-scount b { font-size: 22px; font-weight: 800; line-height: 1; color: var(--brand-text); }
.lx-scount b small { font-size: 15px; color: var(--muted); font-weight: 700; }
.lx-stop.full .lx-scount b { color: var(--good-text); }
.lx-scount > span { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.lx-sbtns { display: flex; gap: 6px; margin-top: auto; padding-top: 6px; }
.lx-sq, .lx-ok { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); display: grid; place-items: center; cursor: pointer; padding: 0; font-size: 18px; font-weight: 900; }
.lx-ok { color: var(--good-text); }
.lx-ok.on { background: var(--good); border-color: var(--good); color: #FFFFFF; }
.lx-ok:disabled, .lx-sb:disabled, .lx-in:disabled { opacity: .45; cursor: not-allowed; }
.lx-gchips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lx-gchip { border: 2px solid transparent; background: var(--gs); color: var(--fg); border-radius: 10px; padding: 5px 11px; font: 800 13px/1.2 inherit; cursor: pointer; }
.lx-gchip[aria-pressed="true"] { background: var(--gt); color: #FFFFFF; }
.lx-grp { border-radius: 16px; overflow: hidden; background: var(--gs); }
.lx-ghead { background: var(--gt); color: #FFFFFF; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 12.5px; font-weight: 800; letter-spacing: .07em; }
.lx-gbadge { background: rgba(255, 255, 255, .25); border-radius: 8px; padding: 2px 8px; letter-spacing: 0; }
.lx-item { padding: 11px 14px; border-top: 1px solid rgba(22, 32, 74, .08); display: flex; flex-direction: column; gap: 6px; }
.lx-item:first-of-type { border-top: none; }
.lx-item.done { opacity: .6; }
.lx-iname { font-weight: 800; font-size: 15.5px; }
.lx-pack { color: var(--muted); font-weight: 600; font-size: 13px; }
.lx-irow { display: flex; align-items: center; gap: 10px; }
.lx-imeta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
.lx-instops { font-size: 12px; font-weight: 800; color: var(--muted); }
.lx-instops.on { color: var(--brand-text); }
.lx-bar { height: 5px; border-radius: 4px; background: rgba(22, 32, 74, .1); overflow: hidden; max-width: 140px; }

<script>
(function () {
"use strict";

/* ================= Hebrew calendar (standard arithmetic calendar) ================= */
const H = (() => {
  const leap = y => ((7 * y + 1) % 19) < 7;
  const lastMonth = y => leap(y) ? 13 : 12;
  const cache = new Map();
  function elapsed(y) {
    if (cache.has(y)) return cache.get(y);
    const me = 235 * Math.floor((y - 1) / 19) + 12 * ((y - 1) % 19) + Math.floor((7 * ((y - 1) % 19) + 1) / 19);
    const pe = 204 + 793 * (me % 1080);
    const he = 5 + 12 * me + 793 * Math.floor(me / 1080) + Math.floor(pe / 1080);
    const cd = 1 + 29 * me + Math.floor(he / 24);
    const cp = 1080 * (he % 24) + pe % 1080;
    let ad = (cp >= 19440 || (cd % 7 === 2 && cp >= 9924 && !leap(y)) || (cd % 7 === 1 && cp >= 16789 && leap(y - 1))) ? cd + 1 : cd;
    if ([0, 3, 5].includes(ad % 7)) ad += 1;
    cache.set(y, ad);
    return ad;
  }
  const ydays = y => elapsed(y + 1) - elapsed(y);
  function mdays(m, y) {
    if ([2, 4, 6, 10, 13].includes(m)) return 29;
    if (m === 12 && !leap(y)) return 29;
    if (m === 8 && ydays(y) % 10 !== 5) return 29;
    if (m === 9 && ydays(y) % 10 === 3) return 29;
    return 30;
  }
  const EPOCH = -1373429;
  function toAbs(m, d, y) {
    let s = d;
    if (m < 7) {
      for (let mm = 7; mm <= lastMonth(y); mm++) s += mdays(mm, y);
      for (let mm = 1; mm < m; mm++) s += mdays(mm, y);
    } else {
      for (let mm = 7; mm < m; mm++) s += mdays(mm, y);
    }
    return s + elapsed(y) + EPOCH;
  }
  function fromAbs(a) {
    let y = Math.floor((a + 1373429) / 366);
    while (a >= toAbs(7, 1, y + 1)) y++;
    const order = [];
    for (let m = 7; m <= lastMonth(y); m++) order.push(m);
    for (let m = 1; m <= 6; m++) order.push(m);
    for (const m of order) if (a <= toAbs(m, mdays(m, y), y)) return { m, d: a - toAbs(m, 1, y) + 1, y };
  }
  const EN = { 1: 'Nisan', 2: 'Iyar', 3: 'Sivan', 4: 'Tammuz', 5: 'Av', 6: 'Elul', 7: 'Tishrei', 8: 'Cheshvan', 9: 'Kislev', 10: 'Teves', 11: 'Shevat', 12: 'Adar', 13: 'Adar II' };
  const HE = { 1: 'ניסן', 2: 'אייר', 3: 'סיון', 4: 'תמוז', 5: 'אב', 6: 'אלול', 7: 'תשרי', 8: 'חשון', 9: 'כסלו', 10: 'טבת', 11: 'שבט', 12: 'אדר', 13: 'אדר ב׳' };
  const monthEn = (m, y) => (leap(y) && m === 12) ? 'Adar I' : EN[m];
  const monthHe = (m, y) => (leap(y) && m === 12) ? 'אדר א׳' : HE[m];
  function gem(n) {
    const vals = [[400, 'ת'], [300, 'ש'], [200, 'ר'], [100, 'ק'], [90, 'צ'], [80, 'פ'], [70, 'ע'], [60, 'ס'], [50, 'נ'], [40, 'מ'], [30, 'ל'], [20, 'כ'], [10, 'י'], [9, 'ט'], [8, 'ח'], [7, 'ז'], [6, 'ו'], [5, 'ה'], [4, 'ד'], [3, 'ג'], [2, 'ב'], [1, 'א']];
    let s = '';
    let r = n;
    for (const [v, ch] of vals) {
      while (r >= v) {
        if (r === 15) { s += 'טו'; r = 0; break; }
        if (r === 16) { s += 'טז'; r = 0; break; }
        s += ch; r -= v;
      }
    }
    return s.length === 1 ? s + '׳' : s.slice(0, -1) + '״' + s.slice(-1);
  }
  return { leap, toAbs, fromAbs, monthEn, monthHe, gem, mdays };
})();

/* Gregorian <-> day number (same count as the Hebrew math above) */
const RD = (y, m, d) => Math.floor(Date.UTC(y, m - 1, d) / 864e5) + 719163;
const rdOf = dt => RD(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
function dateOf(rd) { const x = new Date((rd - 719163) * 864e5); return new Date(x.getUTCFullYear(), x.getUTCMonth(), x.getUTCDate()); }
const dow = rd => ((rd % 7) + 7) % 7; // 0 = Sunday, 6 = Shabbos
const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Shabbos'];
const WDS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Shabbos'];
const MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MONS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtShort = rd => { const d = dateOf(rd); return `${WDS[d.getDay()]}, ${MONS[d.getMonth()]} ${d.getDate()}`; };
const fmtLong = rd => { const d = dateOf(rd); return `${WD[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
function hebStr(rd, withYear = true) { const h = H.fromAbs(rd); return `${h.d} ${H.monthEn(h.m, h.y)}${withYear ? ' ' + h.y : ''}`; }
function hebLetters(rd) { const h = H.fromAbs(rd); return `${H.gem(h.d)} ${H.monthHe(h.m, h.y)} ${H.gem(h.y % 1000)}`; }

function ytName(m, d) {
  if (m === 7) { if (d === 1 || d === 2) return 'Rosh Hashana'; if (d === 10) return 'Yom Kippur'; if (d === 15 || d === 16) return 'Sukkos'; if (d === 22) return 'Shemini Atzeres'; if (d === 23) return 'Simchas Torah'; }
  if (m === 1) { if (d === 15 || d === 16) return 'Pesach'; if (d === 21 || d === 22) return 'Pesach (last days)'; }
  if (m === 3 && (d === 6 || d === 7)) return 'Shavuos';
  return null;
}
function cholName(m, d) {
  if (m === 7 && d >= 17 && d <= 20) return 'Chol Hamoed';
  if (m === 7 && d === 21) return 'Hoshana Rabbah';
  if (m === 1 && d >= 17 && d <= 20) return 'Chol Hamoed';
  return null;
}
function dayKind(rd) {
  const h = H.fromAbs(rd); const w = dow(rd);
  const yt = ytName(h.m, h.d);
  if (yt) return { kind: 'closed', label: yt };
  if (w === 6) return { kind: 'closed', label: 'Shabbos' };
  const n = H.fromAbs(rd + 1); const ytNext = ytName(n.m, n.d);
  const ch = cholName(h.m, h.d);
  if (ytNext) return { kind: 'short', label: ch || ('Erev ' + ytNext.replace(' (last days)', '')) };
  if (w === 5) return { kind: 'short', label: (ch ? ch + ' · ' : '') + 'Erev Shabbos' };
  if (ch) return { kind: 'special', label: ch };
  const chan = rd - H.toAbs(9, 25, h.y);
  if (chan >= 0 && chan < 8) return { kind: 'special', label: 'Chanukah · day ' + (chan + 1) };
  if (h.m === (H.leap(h.y) ? 13 : 12) && h.d === 14) return { kind: 'special', label: 'Purim' };
  if (h.m === 5 && ((h.d === 9 && w !== 6) || (h.d === 10 && w === 0))) return { kind: 'special', label: "Tisha B'Av" };
  if (h.d === 30 || (h.d === 1 && h.m !== 7)) return { kind: 'special', label: 'Rosh Chodesh' };
  return { kind: 'open', label: '' };
}
const isClosed = rd => dayKind(rd).kind === 'closed';

function invStatus(r) { return r.onHand < 0 ? 'zero' : r.onHand < r.reorderAt ? 'low' : 'ok'; }
function renderInventory() {

      ${editing ? `<label class="sr" for="cnt">New count for ${esc(r.name)}</label><input class="inp num" id="cnt" type="number" inputmode="numeric" value="${Math.max(r.onHand, 0)}" style="width:110px"><button class="btn primary sm" data-act="inv-save" data-i="${i}">Save count</button>`

           <div class="actions"><button class="btn ghost sm" data-act="inv-edit" data-i="${i}">Fix count</button>${st !== 'ok' ? `<button class="btn ${inList ? 'ghost' : 'gold'} sm" data-act="inv-reorder" data-i="${i}"${inList ? ' disabled' : ''}>${inList ? 'On reorder list' : 'Reorder'}</button>` : ''}</div>`}
    </div>`;

  <div class="tiles">

function packDays() {
  const out = []; let r = TODAY; let guard = 0;
  while (out.filter(d => !d.closed).length < 4 && guard < 20) {
    const k = dayKind(r);
    out.push({ rd: r, closed: k.kind === 'closed', label: k.label, short: k.kind === 'short' });
    r++; guard++;
  }
  return out;
}
function renderPacking() {
  const days = packDays();
  const open = days.filter(d => !d.closed);
  const sel = open[Math.min(S.packDay, open.length - 1)];
  const all = S.pack.flatMap(l => l.jobs);
  const total = all.reduce((s, j) => s + j.cases, 0);

        <div class="side-act">${j.st === 'next' ? `<button class="btn primary" data-act="pk" data-l="${li}" data-j="${ji}" data-do="start">Start</button>`
          : j.st === 'now' ? `<button class="btn good" data-act="pk" data-l="${li}" data-j="${ji}" data-do="add">+ 6 cases</button><button class="btn ghost" data-act="pk" data-l="${li}" data-j="${ji}" data-do="finish">Done</button>`
          : `<button class="btn ghost" data-act="pk" data-l="${li}" data-j="${ji}" data-do="undo">Undo</button>`}</div>

  const extraLines = S.lines.filter(n => !S.pack.some(p => p.line === n)).map(n => `<section class="line-card"><div class="line-head blue" style="border-radius:0"><h2 style="font-size:18px">${esc(n)}</h2><strong>0 cases</strong></div><p class="sub" style="padding:14px 16px;margin:0">No packing jobs on this line yet.</p></section>`).join('');
  const nextOpen = open[1];

function renderCalendar() {
  const { y, m } = S.calMonth;
  const first = RD(y, m, 1);
  const daysIn = new Date(y, m, 0).getDate();
  const start = first - dow(first);
  const end = first + daysIn - 1;
  const last = end + (6 - dow(end));
  const h1 = H.fromAbs(first), h2 = H.fromAbs(end);
  const hebRange = h1.m === h2.m ? `${H.monthEn(h1.m, h1.y)} ${h1.y}` : `${H.monthEn(h1.m, h1.y)}${h1.y !== h2.y ? ' ' + h1.y : ''} – ${H.monthEn(h2.m, h2.y)} ${h2.y}`;
  let cells = '';
  for (let r = start; r <= last; r++) {
    const k = dayKind(r); const h = H.fromAbs(r); const out = r < first || r > end;
    const lab = k.label || (r < TODAY ? '' : 'Open');
    cells += `<button class="day ${k.kind}${out ? ' out' : ''}${r === TODAY ? ' today' : ''}" data-act="cal-sel" data-rd="${r}" aria-pressed="${S.calSel === r}" aria-label="${fmtLong(r)}, ${hebStr(r)}${k.label ? ', ' + k.label : ''}">
      <span class="top"><span class="g">${dateOf(r).getDate()}</span><span class="h"><span class="en">${h.d} ${H.monthEn(h.m, h.y).slice(0, 3)}</span><span class="he" lang="he">${H.gem(h.d)}</span></span></span>
      <span class="lab">${lab}</span><span class="dot"></span></button>`;
  }
  const sk = dayKind(S.calSel);
  const selInfo = `<section class="card stack"><div class="eyebrow">${S.calSel === TODAY ? 'TODAY' : 'SELECTED DAY'}</div>
    <h2 style="font-size:20px">${fmtLong(S.calSel)}</h2>
    <div>${hebStr(S.calSel)} · <span lang="he" dir="rtl" class="he-text">${hebLetters(S.calSel)}</span></div>
    <div>${sk.kind === 'closed' ? `<span class="tag grey">Closed · ${sk.label}</span> No deliveries or packing.` : sk.kind === 'short' ? `<span class="tag gold">Short day · ${sk.label}</span> Trucks load early.` : sk.kind === 'special' ? `<span class="tag blue">${sk.label}</span> Open as usual.` : '<span class="tag green">Open</span> Normal day.'}</div></section>`;

  // due date calculator
  let dueHtml = '';
  const dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(S.dueDate);
  if (dm) {
    const inv = RD(+dm[1], +dm[2], +dm[3]);
    let due = inv + S.dueNet; const skipped = [];
    while (isClosed(due)) { skipped.push(`${fmtShort(due)} is ${dayKind(due).label}`); due++; }
    dueHtml = `<div class="truck" style="font-size:14px;line-height:1.5">Net ${S.dueNet} lands on ${fmtShort(inv + S.dueNet)}.${skipped.length ? ` ${skipped.join('; ')}, so it moves to <strong>${fmtShort(due)}</strong>.` : ` That's an open day, so it stays <strong>${fmtShort(due)}</strong>.`}</div>`;
  }

  // upcoming
  const hy = H.fromAbs(TODAY).y;
  function nextOf(mm, dd) { for (const yy of [hy, hy + 1]) { const mo = mm === 'adar' ? (H.leap(yy) ? 13 : 12) : mm; const a = H.toAbs(mo, dd, yy); if (a >= TODAY) return a; } }
  const ev = [
    { name: 'Chanukah', a: nextOf(9, 25), when: a => `First candle ${WD[dow(a - 1)]} night, ${MONS[dateOf(a - 1).getMonth()]} ${dateOf(a - 1).getDate()}` },
    { name: 'Purim', a: nextOf('adar', 14), when: a => fmtLong(a) },
    { name: 'Pesach', a: nextOf(1, 15), when: a => `First Seder ${WD[dow(a - 1)]} night, ${MONS[dateOf(a - 1).getMonth()]} ${dateOf(a - 1).getDate()}, ${dateOf(a - 1).getFullYear()}` }
  ].sort((p, q) => p.a - q.a);
  const up = ev.map(e => { const w = Math.round((e.a - TODAY) / 7); return `<div class="truck" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span><strong>${e.name}</strong><br><span class="sub" style="font-size:12px">${hebStr(e.a)}</span></span><span style="text-align:right"><strong style="font-size:13px">${e.when(e.a)}</strong><br><span class="sub" style="font-size:12px">${w <= 1 ? 'this week' : 'about ' + w + ' weeks'}</span></span></div>`; }).join('');

  return `
  ${head('Calendar', `${MON[m - 1]} ${y} · ${hebRange}`, `<button class="btn ghost" data-act="cal-move" data-d="-1" aria-label="Previous month">‹</button><button class="btn ghost" data-act="cal-today">Today</button><button class="btn ghost" data-act="cal-move" data-d="1" aria-label="Next month">›</button>`)}
  <div class="split">
    <section class="card">
      <div class="cal-head"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Shab</div></div>
      <div class="cal">${cells}</div>
      <div class="legend-row"><span><i style="background:var(--closed)"></i>Closed: Shabbos / Yom Tov</span><span><i style="background:var(--gold-soft)"></i>Short day: Erev Shabbos / Erev Yom Tov</span><span><i style="background:var(--brand-soft)"></i>Rosh Chodesh, Chol Hamoed, Chanukah, Purim</span></div>
    </section>
    <aside class="stack" style="gap:16px">
      ${selInfo}
      <section class="card stack">
        <h2>Due dates skip closed days</h2>
        <p class="sub" style="margin:0">Hebrew dates show inside the app only. Invoices your customers get stay the same.</p>
        <div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px">
          <div><label class="lbl" for="due-date">Invoice date</label><input class="inp" type="date" id="due-date" value="${S.dueDate}"></div>
          <div><label class="lbl" for="due-net">Terms</label><select class="sel" id="due-net">${[15, 30, 45, 60].map(n => `<option value="${n}"${S.dueNet === n ? ' selected' : ''}>Net ${n}</option>`).join('')}</select></div>
        </div>
        <div id="due-out">${dueHtml}</div>
      </section>
      <section class="card stack"><h2>Coming up</h2>${up}<button class="btn gold" data-act="soon" data-name="Pesach planning">Plan the Pesach rush</button></section>
      ${REAL ? `<section class="card stack">${seasonCard()}</section>` : ''}
    </aside>
  </div>`;
}

function loadTotals() {
  const items = S.load.flatMap(g => g.items);
  return { boxes: items.reduce((s, i) => s + i.need, 0), loaded: items.reduce((s, i) => s + i.got, 0), items: items.length };
}
function renderLoading() {
  const t = loadTotals();

  const groups = S.load.map((g, gi) => {
    const left = g.items.filter(i => i.got < i.need).length;
    const items = g.items.map((it, ii) => {
      const done = it.got >= it.need;
      if (S.hideDone && done) return '';
      return `<div class="item${done ? ' done' : ''}">

function renderRoute() {

function stopTotals() { const it = S.stop.flatMap(g => g.items); return { need: it.reduce((s, i) => s + i.need, 0), got: it.reduce((s, i) => s + i.got, 0) }; }
function renderStop() {
  const cur = S.stops.find(s => s.st === 'now');
  const t = stopTotals();
  const secTot = sec => { const it = S.stop.filter(g => g.sec === sec).flatMap(g => g.items); return `${it.reduce((s, i) => s + i.got, 0)}/${it.reduce((s, i) => s + i.need, 0)}`; };
  let lastSec = '';
  const groups = S.stop.map((g, gi) => {
    const secHead = g.sec !== lastSec ? `<div class="group-h" style="background:var(--surface);border-top:1px solid var(--line)"><span>${g.sec}</span><span>${secTot(g.sec)} boxes</span></div>` : '';
    lastSec = g.sec;
    return secHead + `<div class="group-h ${g.tone}"><span>${g.group}</span></div>` + g.items.map((it, ii) => {
      const done = it.got >= it.need;
      return `<div class="item${done ? ' done' : ''}">
        <div class="main"><div class="name">${it.name}</div><div class="meta">#${it.code} · ${it.pack} · need ${it.need}</div>${it.loose ? `<span class="tag gold" style="margin-top:4px">${it.loose}</span>` : ''}</div>
        <div class="ctl"><div class="step"><button data-act="sq" data-g="${gi}" data-i="${ii}" data-d="-1" aria-label="One less ${it.name}">−</button><output class="num">${it.got}</output><button data-act="sq" data-g="${gi}" data-i="${ii}" data-d="1" aria-label="One more ${it.name}">+</button></div>
        <button class="check" data-act="sc" data-g="${gi}" data-i="${ii}" aria-pressed="${done}" aria-label="Mark ${it.name} delivered">✓</button></div>
      </div>`;
    }).join('');
  }).join('');
  if (!cur) return `${head('Stop', '')}<section class="card"><h2>No stop in progress</h2><p class="sub">All stops on this route are done.</p><a class="btn ghost" href="#route" data-go="route">Back to deliveries</a></section>`;
  return `
  <div class="page-head"><div style="display:flex;align-items:center;gap:8px"><a class="icon-btn" href="#route" data-go="route" aria-label="Back to deliveries" style="color:var(--fg)"><svg viewBox="0 0 24 24">${I.back}</svg></a><div><h1>[Store name]</h1><p class="sub">Stop ${cur.n} · Invoice #[number]</p></div></div>
    <div class="actions"><button class="btn ghost" data-act="soon" data-name="Calling the store">${ic('phone')} Call</button><label class="btn ghost" style="cursor:pointer">${ic('camera')} Photo<input type="file" accept="image/*" capture="environment" id="stop-photo" hidden></label></div></div>
  <div class="note"><strong>Store note:</strong> Use the back door. Ask for [name] to sign.</div>
  <div class="split">
    <div class="stack" style="gap:12px">
      <section class="card stack">
        <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:24px;font-weight:800" class="num">${t.got} <span class="sub" style="font-size:15px">of ${t.need} boxes</span></div><button class="btn ghost sm" data-act="stop-all" style="color:var(--good-text)">✓ All</button></div>
        <div class="bar good"><i style="width:${Math.round(t.got / t.need * 100)}%"></i></div>
        <div class="field" style="border-radius:23px">${ic('search')}<label class="sr" for="st-q">Find an item</label><input id="st-q" placeholder="Find an item or scan"></div>
      </section>
      <section class="line-card">${groups}</section>
    </div>
    <aside class="card stack" style="position:sticky;top:calc(80px + env(safe-area-inset-top, 0px))">
      <h2>Finish this stop</h2>${proofHtml()}
      <div style="display:flex;justify-content:space-between"><span>Collect today</span><strong>[$ amount]</strong></div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px"><button class="btn ghost sm" data-act="sig-open">${S.proof.sig ? 'Signed ✓' : 'Signature'}</button><label class="btn ghost sm" style="cursor:pointer">Photo${S.proof.photos.length ? ' · ' + S.proof.photos.length : ''}<input type="file" accept="image/*" capture="environment" id="stop-photo2" hidden></label><button class="btn pink sm" data-act="soon" data-name="Collecting payment on the road">Payment</button></div>
      ${S.stopConfirm ? `<div class="card confirm stack" style="padding:14px"><strong>${t.need - t.got} box${t.need - t.got > 1 ? 'es' : ''} not delivered.</strong><span class="sub" style="margin:0">Finish anyway and mark them short? The office gets a note for a credit.</span><div class="actions"><button class="btn primary" data-act="stop-finish" data-force="1">Finish as short</button><button class="btn ghost" data-act="stop-cancel">Keep delivering</button></div></div>`
        : `<button class="btn primary big full" data-act="stop-finish">Finish delivery</button>`}
    </aside>
  </div>`;
}

const byCode = c => S.catalog.find(p => String(p.code) === String(c));
const SAMPLE2REAL = { '1': 'Packs Chuster:001 Fine 18/11', '5': 'Packs Chuster:004 Barley', '7': 'Packs Chuster:005 Toast Barley', '15': 'Packs Chuster:010 Sm. Flakes', '62': 'Packs Chuster:006 Chuster Garlic Farfel', '66': 'Packs Chuster Snacks:041 SD Pretzel Crunc 84 x 1', '57': 'Packs Chuster Snacks:038 SD Pretzel 96 x 1.1' };
function byItem(x) {
  if (x.idx != null) return S.catalog[x.idx];
  if (!x.code) return null;
  if (REAL) return S.catalog.find(p => p.full === SAMPLE2REAL[x.code]) || null;
  return byCode(x.code) || null;
}
const money = n => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const chTag = ch => ch === 'WhatsApp' ? `<span class="tag green">${ic('chat')} WhatsApp</span>` : `<span class="tag blue">${ic('mail')} Email</span>`;

const fm = n => { const a = Math.abs(n), s = n < 0 ? '−' : ''; return s + (a >= 1e6 ? '$' + (a / 1e6).toFixed(2) + 'M' : a >= 1e4 ? '$' + Math.round(a / 1e3) + 'K' : a >= 1e3 ? '$' + (a / 1e3).toFixed(1) + 'K' : '$' + Math.round(a)); };
const fn = n => Math.round(n).toLocaleString('en-US');
const pct = (a, b) => b ? Math.round((a / b - 1) * 100) : 0;
const sgn = p => (p > 0 ? '+' : '') + p + '%';
const isoRd = s => { const [y, m, d] = s.split('-').map(Number); return RD(y, m, d); };
const AGE_COLORS = ['var(--good)', 'var(--chart-a)', 'var(--gold)', '#E07B39', 'var(--bad)'];
const AGE_LABELS = ['Not due yet', '1–30 days late', '31–60 days late', '61–90 days late', 'Over 90 days'];
const linkBtn = 'background:none;border:none;padding:0;color:var(--brand-text);font:inherit;font-weight:700;cursor:pointer;text-align:left';

function seasonCard() {
  if (!REAL) return '';
  return `<h2>Yom Tov seasons</h2><p class="sub" style="margin:0">Sales in the weeks before each Yom Tov (6 weeks for Pesach and Rosh Hashana, 4 for Chanuka, 3 for Purim and Shavuos), plus the 3 weeks after Pesach when stores restock with fresh goods. Lined up on the Jewish calendar.</p>` + REAL.seasons.map(s => {
    const rows = s.rows; if (!rows.length) return '';
    const max = Math.max(...rows.map(r => r.sales));
    const last = rows[rows.length - 1], prev = rows[rows.length - 2];
    return `<div class="stack" style="gap:8px;margin-top:8px"><strong>${s.name}</strong>
      ${rows.map(r => `<div><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px"><span>${r.year} · <span lang="he" class="he-text">${H.gem(r.heb % 1000)}</span></span><strong class="num">${fm(r.sales)} · ${fn(r.cases)} cases</strong></div><div class="bar" style="margin-top:4px"><i style="width:${(r.sales / max * 100).toFixed(1)}%"></i></div></div>`).join('')}
      ${prev ? `<div class="truck" style="font-size:13px;line-height:1.5">${last.year} was ${sgn(pct(last.sales, prev.sales))} in sales and ${sgn(pct(last.cases, prev.cases))} in cases over ${prev.year}. If ${last.year + 1} grows the same way, plan for about <strong>${fm(last.sales * last.sales / prev.sales)}</strong> and <strong>${fn(last.cases * last.cases / prev.cases)} cases</strong>.</div>` : ''}
    </div>`;
  }).join('');
}

function chg(cur, prev) {
  if (!prev) return cur ? '<span style="color:var(--good-text);font-weight:700">new</span>' : '';
  const p = pct(cur, prev);
  return `<span style="color:${p >= 0 ? 'var(--good-text)' : 'var(--bad-text)'};font-weight:700">${p >= 0 ? '▲ +' : '▼ '}${p}%</span>`;
}

      <strong class="num" style="text-align:right">${fm(x.amount)}<br><span style="font-size:12px">${chg(x.amount, x.amountPrev)}</span></strong></div>`).join('')}</div>

/* ---------- What to pack: usual orders for the next working day, minus stock ---------- */
function nextWorkDay(from) { let r = from + 1; while (isClosed(r) || dow(r) === 6) r++; return r; }

  const sum = {}; OR.list.forEach(o => { if (o.t !== 'inv' || !days.includes(o.d)) return; rowsOf(o.l).forEach(([ref, q]) => { if (typeof ref === 'number') sum[ref] = (sum[ref] || 0) + q; }); });
  const avg = {}; Object.keys(sum).forEach(k => { avg[k] = sum[k] / Math.max(1, days.length); });

}
function pnDefault() { const to = isoRd(REAL.orders.to); return nextWorkDay(TODAY - 1 < to ? to : TODAY - 1); }
function pnRange() { const f = S.pnFrom || pnDefault(); const t = Math.max(f, S.pnTo || f); return [f, t]; }

  const tot = {}; deliv.forEach(r => { const A = pnAvgFor(dow(r)).avg; Object.keys(A).forEach(k => { tot[k] = (tot[k] || 0) + A[k]; }); });
  const week = {};
  OR.list.forEach(o => { if (o.t !== 'inv') return; const r = isoRd(o.d); if (r > to - 56) rowsOf(o.l).forEach(([ref, q]) => { if (typeof ref === 'number') week[ref] = (week[ref] || 0) + q / 8; }); });
  const rows = REAL.catalog.map((c, i) => ({ c, i, day: tot[i] || 0, wk: week[i] || 0, stock: c.stock })).filter(r => (r.day > 0 || r.c.full) && (!/Loose/.test(r.c.group) || /\s(60|120)\s*$/.test(r.c.full)));
  rows.forEach(r => { r.need = Math.ceil(r.day * 1.1); r.pack = Math.max(0, r.need - Math.max(0, r.stock || 0)); r.wks = r.wk > 0 ? (r.stock || 0) / r.wk : null; });

  if ((S.pnSort || 'most') === 'most') rows.sort((x, y) => (y.pack > 0) - (x.pack > 0) || y.pack - x.pack || y.need - x.need);

(function () {

  window.appVersionText = () => nice(mine);

        document.body.appendChild(b);

  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
})();

  if ((t.id === 'stop-photo' || t.id === 'stop-photo2') && t.files && t.files[0]) { shrinkImage(t.files[0], url => { S.proof.photos.push(url); render(); toast('Photo added to this stop.'); }); }
  if (t.id === 'rep-mon') { S.repMon = +t.value; render(); }
  if (t.id === 'rep-goal') { const v = parseFloat(t.value.replace(/[$,]/g, '')); if (v > 0) S.repCfg.goals[t.dataset.r] = v; else delete S.repCfg.goals[t.dataset.r]; saveReps(); render(); toast('Monthly goal saved on this device.'); }
  if (t.id === 'ms-end' && t.value) { S.ms.end = t.value; render(); }
  if (t.id === 'rep-name') { const v = t.value.trim(); if (v) S.repCfg.names[t.dataset.r] = v; else delete S.repCfg.names[t.dataset.r]; saveReps(); render(); }
  if (t.id === 'rep-rate') { const v = parseFloat(t.value); if (v >= 0) S.repCfg.rates[t.dataset.r] = v; else delete S.repCfg.rates[t.dataset.r]; saveReps(); render(); toast('Commission % saved on this device.'); }
  if (cl.contains('it-cost')) { const v = parseFloat(t.value.replace(/[$,]/g, '')); if (v > 0) { S.myCost[t.dataset.f] = v; toast('Cost saved on this device.'); } else delete S.myCost[t.dataset.f]; saveCosts(); render(); }
  if (t.id === 'pr-all') { S.prAll = t.checked; render(); }
  if (t.id === 'pr-for' || t.id === 'pr-contact') { const pv = document.getElementById('ps-preview'); if (pv) pv.innerHTML = prSheet(S.prKind); }
});
document.addEventListener('input', e => {
  if (e.target.classList && e.target.classList.contains('pl-inp')) {
    const m = S.pl[e.target.dataset.k]; const v = parseFloat(e.target.value);
    if (v > 0) m[e.target.dataset.i] = v; else delete m[e.target.dataset.i];
    const sm = document.getElementById('pl-summary'); if (sm) sm.innerHTML = plSummaryHtml();
    return;
  }
  if (e.target.id === 'pl-q') { S.plQ = e.target.value; const box = document.getElementById('pl-list'); if (box) box.innerHTML = plRows(); return; }
  if (e.target.id === 'stmt-text') {
    S.stmtDraft[e.target.dataset.n] = e.target.value;
    const m = document.getElementById('stmt-mail'); if (m) m.href = mailHref(m.dataset.to, e.target.value);
    const w = document.getElementById('stmt-wa'); if (w) w.href = waHref(w.dataset.to, e.target.value);
    return;
  }
  if (e.target.classList && e.target.classList.contains('po-q')) { const v = parseFloat(e.target.value); if (v > 0) S.poQ[e.target.dataset.i] = v; else delete S.poQ[e.target.dataset.i]; const t = document.getElementById('po-tot'); if (t) t.textContent = poTotalTxt(); return; }
  if (e.target.id === 'po-no') { S.poNo = e.target.value; return; }
  if (e.target.id === 'po-note') { S.poNote = e.target.value; return; }
  if (e.target.classList && e.target.classList.contains('oq-inp')) {
    const el = e.target; const digits = el.value.replace(/[^0-9]/g, ''); if (digits !== el.value) el.value = digits;
    const v = parseInt(digits, 10) || 0; const k = el.dataset.k;
    if (v) S.oq[k] = v; else delete S.oq[k];
    const row = el.closest('.irow'); if (row) row.classList.toggle('on', !!v);
    const minus = el.previousElementSibling; if (minus) minus.disabled = !v;
    orderRefresh(); return;
  }
  if (e.target.id === 'it-q') { S.itQ = e.target.value; const box = document.getElementById('it-list'); if (box) box.innerHTML = itList(); return; }
  if (e.target.id === 'pr-for' || e.target.id === 'pr-contact') {
    if (e.target.id === 'pr-for') S.prFor = e.target.value; else { S.prContact = e.target.value; try { localStorage.setItem('chuster-pl-contact', S.prContact); } catch (x) { /* storage blocked */ } }
    const pv = document.getElementById('ps-preview'); if (pv) pv.innerHTML = prSheet(S.prKind); return;
  }
  if (e.target.classList && e.target.classList.contains('ive-inp') && S.ivEdit) { S.ivEdit.q[e.target.dataset.k] = Math.max(0, parseInt(e.target.value, 10) || 0); return; }
  if (e.target.id === 'ive-find' && S.ivEdit) { S.ivEdit.find = e.target.value; const el = document.getElementById('ive-res'); if (el) el.innerHTML = ivFind(S.ivEdit); return; }
  if (e.target.id === 'ord-q') { S.ordQ = e.target.value; const ol = document.getElementById('ord-list'); if (ol) ol.innerHTML = ordList(); return; }
  if (e.target.id === 'cust-q') { S.custQ = e.target.value; const box = document.getElementById('cust-list'); if (box) box.innerHTML = custRows(); return; }
  if (e.target.id === 'store-q') { S.storeQ = e.target.value; const sl = document.getElementById('store-list'); if (sl) sl.innerHTML = storeRows(); return; }
  if (e.target.id !== 'add') return;
  S.orderQ = e.target.value;
  const box = document.getElementById('order-list');
  if (box) box.innerHTML = orderRows();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const f = e.target.id; let msg = '';
  if (f === 'geo-form') { const g = id => (document.getElementById(id) || {}).value || ''; if (g('geo-user') && g('geo-pass')) geoLogin(g('geo-db').trim() || 'chuster', g('geo-user').trim(), g('geo-pass')); return; }
  if (f === 'ask-form') { const el = document.getElementById('ask-q'); if (el) doAsk(el.value); return; }
  if (f === 'f-product' && v('p-name')) { S.catalog.push({ name: v('p-name'), code: v('p-code') || '—', pack: v('p-pack') || '—', brand: v('p-brand'), cat: v('p-cat'), price: v('p-price') }); msg = `Added ${v('p-name')}. It now shows up in New order.`; }
  if (f === 'f-store' && v('s-name')) { S.stores.push({ name: v('s-name'), address: v('s-addr'), phone: v('s-phone'), email: v('s-email'), truck: v('s-truck'), note: v('s-note') }); msg = `Added ${v('s-name')}.`; }
  if (f === 'f-truck' && v('t-name')) { S.trucks.push({ name: v('t-name'), driver: v('t-driver') }); msg = `Added ${v('t-name')}.`; }
  if (f === 'f-person' && v('w-name')) { S.people.push({ name: v('w-name'), role: v('w-role') }); msg = `Added ${v('w-name')}.`; }
  if (f === 'f-line' && v('l-name')) { S.lines.push(v('l-name')); msg = `Added ${v('l-name')}.`; }
  if (msg) { save(); render(); toast(msg); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.tagName === 'DETAILS' && d.open && d.closest('#topnav')) document.querySelectorAll('#topnav details[open]').forEach(x => { if (x !== d) x.open = false; }); }, true);
document.addEventListener('click', e => { if (!e.target.closest('#topnav details')) document.querySelectorAll('#topnav details[open]').forEach(x => { x.open = false; }); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); document.querySelectorAll('#topnav details[open]').forEach(x => { x.open = false; }); } if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('oq-inp')) { const all = [...document.querySelectorAll('.oq-inp')]; const n = all[all.indexOf(e.target) + 1]; if (n) n.focus(); else e.target.blur(); e.preventDefault(); } });
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('oq-inp')) setTimeout(() => { try { e.target.select(); } catch (x) { /* ignore */ } }, 0); });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== S.view && VIEWS[v]) go(v); });

go((location.hash || '').slice(1) || 'home');
})();
</script>
